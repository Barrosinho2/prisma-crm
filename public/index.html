  let foot = '';
  if (aberto) foot = l.proximoContato ? followChip(l.proximoContato) : '<span class="muted small">sem próximo contato</span>';
  else if (l.etapa === 'ganho') foot = `<span class="muted small">${l.fechadoEm ? 'fechado em ' + fmtDateShort(l.fechadoEm) : 'ganho'}</span>`;
  else foot = `<span class="muted small">${esc(l.motivoPerda || 'perdido')}</span>`;
  return `<article class="lcard" draggable="${S.readOnly || isTouch() ? 'false' : 'true'}" data-id="${esc(l.id)}" tabindex="0" aria-label="${esc(l.empresa)}">
    <div class="lc-top"><h4>${esc(l.empresa)}</h4><span class="lc-tr"><button type="button" class="lc-more" data-more="${esc(l.id)}" aria-label="Ações rápidas para ${esc(l.empresa)}" aria-haspopup="menu" data-write>${ic('more')}</button>${avatar(l.responsavel, 'sm')}</span></div>
    ${l.contato || l.segmento ? `<p class="lc-sub">${esc([l.contato, l.segmento].filter(Boolean).join(' · '))}</p>` : ''}
    ${(l.servicos || []).length || l.demo ? `<div class="lc-tags">${servTags(l.servicos)}${demoTag(l)}</div>` : ''}
    <div class="lc-bot"><b class="lc-val">${l.valor ? money0(l.valor) : '<span class="muted">sem valor</span>'}</b>${foot}</div>
    ${aberto && dias >= 14 ? `<p class="lc-stale">${ic('alert')}${dias} dias nesta etapa</p>` : ''}
  </article>`;
}

      body.innerHTML = emptyState('Nenhum cliente ainda', 'Ao marcar um lead como ganho, o cliente é criado com o projeto e as parcelas.', `<button type="button" class="btn btn-primary" data-new-cli data-write>${ic('plus')}Cadastrar cliente</button>`);

      return;

    const n = norm(Clientes.q).trim();
    let rows = all
      .filter((c) => !n || [c.nome, c.contato, c.documento, c.email, c.cidade].some((x) => norm(x).includes(n)))
      .map((c) => ({ c, f: Calc.clienteFin(c) }));
    const ord = Clientes.ordem;
    rows.sort((a, b) => (ord === 'nome' ? byName(a.c.nome, b.c.nome) : ord === 'recente' ? String(b.c.desde || '').localeCompare(String(a.c.desde || '')) : ord === 'aberto' ? b.f.aberto - a.f.aberto : b.f.recebido - a.f.recebido));
    body.innerHTML = rows.length
      ? `<div class="tbl-wrap panel"><table class="tbl tbl-click tbl-cards k2"><thead><tr><th>Cliente</th><th>Contato</th><th class="num">Projetos</th><th class="num">Recebido</th><th class="num">A receber</th><th class="num">Recorrente</th><th>Desde</th></tr></thead><tbody>${rows
          .map(({ c, f }) => `<tr data-id="${esc(c.id)}" tabindex="0"><td class="ga-main"><b>${esc(c.nome)}</b>${demoTag(c)}<small class="cell-sub">${esc([c.segmento, c.cidade].filter(Boolean).join(' · '))}</small></td><td class="ga-sub">${esc(c.contato || '—')}<small class="cell-sub">${esc(c.telefone || c.email || '')}</small></td><td class="num hide-sm">${f.projetos.length}</td><td class="num ga-val" data-label="recebido">${money0(f.recebido)}</td><td class="num ga-side"${f.aberto ? ' data-label="a receber"' : ''}>${f.aberto ? money0(f.aberto) : '<span class="dash">—</span>'}</td><td class="num hide-sm">${f.mrr ? money0(f.mrr) + '/mês' : '—'}</td><td class="hide-sm">${c.desde ? fmtDate(c.desde) : '—'}</td></tr>`)
          .join('')}</tbody></table></div>`
      : emptyState('Nenhum cliente encontrado', 'Tente outro nome ou limpe a busca.');
    $$('tr[data-id]', body).forEach((tr) => {
      tr.addEventListener('click', () => showCliente(tr.dataset.id));
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') showCliente(tr.dataset.id); });
    });
  },
};

    const body = $('#pj_body');

    const all = Store.all('projetos');
    const ativos = all.filter((p) => PROJ_ATIVOS.includes(p.status));
    const aReceber = sum(ativos.concat(all.filter((p) => p.status === 'entregue')), (p) => Calc.projetoFin(p).pendente);
    $('#pj_sub').textContent = all.length ? `${plural(ativos.length, 'projeto em andamento', 'projetos em andamento')}, ${money0(sum(ativos, (p) => p.valor))} em carteira e ${money0(aReceber)} a receber.` : '';
    if (!all.length) {
      body.innerHTML = emptyState('Nenhum projeto ainda', 'Registre uma venda para criar o projeto e as parcelas no caixa.', `<button type="button" class="btn btn-primary" data-new-venda data-write>${ic('plus')}Registrar venda</button>`);
      on(body, '[data-new-venda]', 'click', () => winFlow());
      return;

    const n = norm(Projetos.q).trim();
    const list = all
      .filter((p) => (Projetos.filtro === 'ativos' ? PROJ_ATIVOS.includes(p.status) : Projetos.filtro === 'entregue' ? p.status === 'entregue' : true))
      .filter((p) => !Projetos.serv || p.servico === Projetos.serv)
      .filter((p) => !n || norm(p.titulo).includes(n) || norm(clienteNome(p.clienteId)).includes(n))
      .sort((a, b) => {

        return order.indexOf(a.status) - order.indexOf(b.status) || String(a.prazo || '9999').localeCompare(String(b.prazo || '9999'));

      ? `<div class="tbl-wrap panel"><table class="tbl tbl-click tbl-cards k3"><thead><tr><th>Projeto</th><th>Status</th><th class="num">Valor</th><th class="col-pay">Recebido</th><th>Prazo</th><th>Equipe</th></tr></thead><tbody>${list
          .map((p) => {

            return `<tr data-id="${esc(p.id)}" tabindex="0"><td class="ga-main"><b>${esc(p.titulo)}</b>${demoTag(p)}<small class="cell-sub">${esc(clienteNome(p.clienteId))} · ${esc(SERVICO[p.servico] || '')}</small></td><td class="ga-sub">${statusPill(p.status)}</td><td class="num ga-val">${money0(p.valor)}</td><td class="col-pay ga-full"><div class="paycell">${meter(f.pct)}<small>${money0(f.recebido)} recebido${f.pendente ? ` · ${money0(f.pendente)} a receber` : ''}</small></div></td><td class="ga-side">${p.prazo ? (late ? pill(`Atrasado · ${fmtDateShort(p.prazo)}`, 'bad', 'alert') : `<span class="nowrap">${fmtDate(p.prazo)}</span>`) : '<span class="muted dash">—</span>'}</td><td class="hide-sm"><span class="av-pair">${avatar(p.vendedor, 'sm')}${avatar(p.executor, 'sm')}</span></td></tr>`;
          })
          .join('')}</tbody></table></div>`
      : emptyState('Nenhum projeto com esses filtros', 'Troque o filtro de status ou limpe a busca.');
    $$('tr[data-id]', body).forEach((tr) => {
      tr.addEventListener('click', () => showProjeto(tr.dataset.id));
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') showProjeto(tr.dataset.id); });
    });
  },
};

  q: '',
  mount(root) {

    const pend = Calc.recPendentes(m);

    const n = norm(Fin.q).trim();
    const list = doMes
      .filter((l) => !Fin.tipo || l.tipo === Fin.tipo)
      .filter((l) => !Fin.cat || l.categoria === Fin.cat)
      .filter((l) => !Fin.status || (Fin.status === 'aberto' ? !l.pagoEm : Calc.lancStatus(l, t) === Fin.status))
      .filter((l) => !n || norm(l.descricao).includes(n) || norm(clienteNome(l.clienteId)).includes(n))
      .sort((a, b) => String(a.vencimento).localeCompare(String(b.vencimento)) || (a.tipo === 'entrada' ? -1 : 1));
    const cats = uniq(doMes.map((l) => l.categoria).filter(Boolean)).sort(byName);
    const despCat = uniq(doMes.filter((l) => l.tipo === 'saida').map((l) => l.categoria || 'Sem categoria'))
      .map((c) => {
        const ls = doMes.filter((l) => l.tipo === 'saida' && (l.categoria || 'Sem categoria') === c);

      .sort((a, b) => b.value - a.value);

    const totE = sum(list.filter((l) => l.tipo === 'entrada'), (l) => l.valor);
    const totS = sum(list.filter((l) => l.tipo === 'saida'), (l) => l.valor);
    body.innerHTML = `
      <div class="fin-top">
        <div class="month-nav" role="group" aria-label="Mês"><button type="button" class="icon-btn" data-m="-1" aria-label="Mês anterior">${ic('left')}</button><span aria-live="polite">${monthLabel(m)}</span><button type="button" class="icon-btn" data-m="1" aria-label="Próximo mês">${ic('right')}</button>${m !== thisMonth() ? '<button type="button" class="btn btn-ghost btn-sm" data-m="0">Mês atual</button>' : ''}</div>
      </div>
      <section class="kpis kpis-4" aria-label="Resumo de ${monthLabel(m)}">
        <div class="kpi"><span class="kpi-l">Entradas recebidas</span><b class="kpi-v">${money0(x.recebido)}</b><small>${x.abertoEntrada ? `faltam ${money0(x.abertoEntrada)} de ${money0(x.previstoEntrada)} previstos` : x.previstoEntrada ? 'tudo o que vence no mês já entrou' : 'nada previsto para o mês'}</small></div>
        <div class="kpi"><span class="kpi-l">Saídas pagas</span><b class="kpi-v">${money0(x.pago)}</b><small>${x.abertoSaida ? `faltam ${money0(x.abertoSaida)} de ${money0(x.previstoSaida)} previstos` : x.previstoSaida ? 'tudo o que vence no mês já foi pago' : 'nada previsto para o mês'}</small></div>
        <div class="kpi"><span class="kpi-l">Resultado do mês</span><b class="kpi-v ${x.resultado < 0 ? 'neg' : ''}">${signedMoney0(x.resultado)}</b><small>previsto ${signedMoney0(x.previstoEntrada - x.previstoSaida)} com tudo pago</small></div>
        <div class="kpi"><span class="kpi-l">Saldo em caixa hoje</span><b class="kpi-v ${saldo < 0 ? 'neg' : ''}">${money0(saldo)}</b><small>${cfg().saldoInicialData ? `desde ${fmtDate(cfg().saldoInicialData)}` : 'soma de tudo que já foi pago'}</small></div>
      </section>
      ${pend.length && m <= monthAdd(thisMonth(), 1) ? (cfg().auto.recorrencias && m === thisMonth() && !S.readOnly ? `<div class="banner b-blue">${ic('plane')}<div><b>Lançando ${plural(pend.length, 'recorrência', 'recorrências')} de ${MESES[+m.slice(5, 7) - 1]} no caixa…</b> ${esc(pend.map((r) => r.descricao).join(', '))}.</div></div>` : `<div class="banner b-blue">${ic('repeat')}<div><b>${plural(pend.length, 'recorrência ainda não lançada', 'recorrências ainda não lançadas')} em ${MESES[+m.slice(5, 7) - 1]}:</b> ${esc(pend.map((r) => r.descricao).join(', '))}.${m > thisMonth() && cfg().auto.recorrencias ? ' O piloto automático lança no dia 1º; lance agora se quiser ver antes.' : ''}</div><button type="button" class="btn btn-sm btn-primary" data-lancar="${m}" data-write>Lançar agora</button></div>`) : ''}
      <div class="grid g-31">
        <section class="panel">
          <div class="toolbar in-panel">
            <div class="seg seg-sm" role="radiogroup" aria-label="Tipo" id="fi_tipo">${[['', 'Tudo'], ['entrada', 'Entradas'], ['saida', 'Saídas']].map(([v, l]) => `<button type="button" role="radio" data-v="${v}" aria-checked="${Fin.tipo === v}">${l}</button>`).join('')}</div>
            <select id="fi_status" aria-label="Status"><option value="">Qualquer status</option><option value="aberto">Em aberto</option><option value="atrasado">Atrasados</option><option value="pago">Pagos ou recebidos</option></select>
            <select id="fi_cat" aria-label="Categoria"><option value="">Todas as categorias</option>${cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>

          ${list.length ? `<div class="tbl-wrap"><table class="tbl tbl-click fin-tbl tbl-cards kfin"><thead><tr><th>Vence</th><th>Descrição</th><th class="num">Valor</th><th>Status</th><th><span class="sr">Ações</span></th></tr></thead><tbody>${list.map((l) => finRow(l)).join('')}</tbody><tfoot><tr><td colspan="2">${plural(list.length, 'lançamento', 'lançamentos')}</td><td class="num" colspan="3"><span class="pos">+${money(totE)}</span> <span class="neg">−${money(totS)}</span></td></tr></tfoot></table></div>` : `<div class="pad">${emptyState(doMes.length ? 'Nada com esses filtros' : 'Nenhum lançamento neste mês', doMes.length ? 'Limpe os filtros para ver tudo.' : 'Registre entradas e despesas, ou lance as recorrências do mês.', doMes.length ? '' : `<button type="button" class="btn btn-primary" data-nova2="saida" data-write>${ic('plus')}Nova despesa</button>`)}</div>`}

      Fin.q = q.value;

    bindFinRows(body);

  renderAberto(body, rec, pag) {
    const col = (titulo, d, tipo) => {
      const list = d.list.slice().sort((a, b) => String(a.vencimento).localeCompare(String(b.vencimento)));
      return `<section class="panel"><div class="panel-h"><div><h3>${titulo}</h3><p class="panel-sub">${money(d.total)}${d.atrasados.length ? ` · <span class="neg">${money(d.totalAtrasado)} em atraso</span>` : ''}</p></div><button type="button" class="btn btn-sm" data-nova3="${tipo}" data-write>${ic('plus')}Adicionar</button></div>

  },
  renderRec(body) {
    const m = thisMonth();
    const recs = Store.all('recorrencias');
    const pend = Calc.recPendentes(m);
    const mrr = Calc.mrr();
    const sec = (titulo, tipo, vazio) => {
      const list = recs.filter((r) => r.tipo === tipo).sort((a, b) => (b.ativo ? 1 : 0) - (a.ativo ? 1 : 0) || (+a.dia || 0) - (+b.dia || 0));
      const tot = tipo === 'entrada' ? mrr.entrada : mrr.saida;
      return `<section class="panel"><div class="panel-h"><div><h3>${titulo}</h3><p class="panel-sub">${money(tot)} por mês${list.some((r) => r.frequencia === 'anual' && r.ativo) ? ' (anuais divididas por 12)' : ''}</p></div><button type="button" class="btn btn-sm" data-nrec="${tipo}" data-write>${ic('plus')}Adicionar</button></div>
        ${list.length ? `<div class="tbl-wrap"><table class="tbl tbl-click tbl-cards k2"><thead><tr><th>Descrição</th><th>Quando</th><th class="num">Valor</th><th>${esc(monthLabel(m, 'name'))}</th></tr></thead><tbody>${list
          .map((r) => {
            const aplica = Calc.recAplica(r, m);
            const lanc = aplica && Calc.recLancada(r, m);
            const pulada = aplica && !lanc && Calc.recPulada(r, m);
            return `<tr data-rec="${esc(r.id)}" tabindex="0" class="${r.ativo ? '' : 'off'}"><td class="ga-main"><b>${esc(r.descricao)}</b>${demoTag(r)}<small class="cell-sub">${esc(r.categoria || '')}${r.clienteId ? ' · ' + esc(clienteNome(r.clienteId)) : ''}</small></td><td class="nowrap ga-sub">${r.frequencia === 'anual' ? `todo ${esc(r.dia)} de ${MESES[(+r.mesAnual || 1) - 1]}` : `todo dia ${esc(r.dia)}`}</td><td class="num ga-val">${money(r.valor)}</td><td class="ga-side">${!r.ativo ? pill('Pausada', 'gray') : !aplica ? '<span class="muted small">não vence</span>' : lanc ? pill('Lançada', 'good', 'check') : pulada ? pill('Pulada', 'gray') : pill('A lançar', 'warn', 'repeat')}</td></tr>`;
          })
          .join('')}</tbody></table></div>` : `<p class="muted pad">${vazio}</p>`}</section>`;
    };
    const autoRec = cfg().auto.recorrencias;
    body.innerHTML = `${pend.length && !(autoRec && !S.readOnly) ? `<div class="banner b-blue">${ic('repeat')}<div><b>${plural(pend.length, 'recorrência de ' + MESES[+m.slice(5, 7) - 1] + ' ainda não lançada', 'recorrências de ' + MESES[+m.slice(5, 7) - 1] + ' ainda não lançadas')}.</b> Lançar cria os valores em aberto no caixa, com o vencimento de cada uma.</div><button type="button" class="btn btn-sm btn-primary" data-lancar="${m}" data-write>Lançar ${MESES[+m.slice(5, 7) - 1]}</button></div>` : pend.length ? `<div class="banner b-blue">${ic('plane')}<div><b>Lançando ${plural(pend.length, 'recorrência', 'recorrências')} de ${MESES[+m.slice(5, 7) - 1]} no caixa…</b></div></div>` : `<div class="banner b-good">${ic(autoRec ? 'plane' : 'check')}<div>Todas as recorrências de ${MESES[+m.slice(5, 7) - 1]} já estão no caixa.${autoRec ? ' O piloto automático lança as do próximo mês no dia 1º.' : ''}</div></div>`}
      <div class="grid g-11">${sec('Despesas fixas', 'saida', 'Cadastre assinaturas, hospedagem, contador e outros custos que se repetem.')}${sec('Receitas recorrentes', 'entrada', 'Mensalidades de manutenção e suporte aparecem aqui.')}</div>
      <section class="kpis kpis-3"><div class="kpi"><span class="kpi-l">Receita recorrente</span><b class="kpi-v">${money0(mrr.entrada)}</b><small>por mês</small></div><div class="kpi"><span class="kpi-l">Custos fixos</span><b class="kpi-v">${money0(mrr.saida)}</b><small>por mês</small></div><div class="kpi"><span class="kpi-l">Cobertura</span><b class="kpi-v">${mrr.saida ? pct(mrr.entrada / mrr.saida) : '—'}</b><small>dos custos fixos pagos pela receita recorrente</small></div></section>`;
    on(body, '[data-lancar]', 'click', (e, b) => lancarRecorrencias(b.dataset.lancar));
    on(body, '[data-nrec]', 'click', (e, b) => editRecorrencia(null, { tipo: b.dataset.nrec, forma: b.dataset.nrec === 'entrada' ? 'Pix' : 'Cartão' }));
    $$('tr[data-rec]', body).forEach((tr) => {
      tr.addEventListener('click', () => editRecorrencia(tr.dataset.rec));
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') editRecorrencia(tr.dataset.rec); });
    });
  },
  renderProj(body) {
    const { pts, atrasadosEntrada, atrasadosSaida } = Calc.projecao(90);
    const at = (d) => pts[Math.min(d, pts.length - 1)].v;
    let minI = 0;
    pts.forEach((p, i) => { if (p.v < pts[minI].v) minI = i; });
    Charts.set('fi_proj', lineSpec(pts));
    const prox = [];
    pts.slice(0, 31).forEach((p) => p.itens.forEach((it) => prox.push({ d: p.d, ...it })));
    body.innerHTML = `<section class="kpis kpis-4" aria-label="Projeção">
        <div class="kpi"><span class="kpi-l">Hoje</span><b class="kpi-v">${money0(at(0))}</b><small>saldo depois do que vence hoje</small></div>
        <div class="kpi"><span class="kpi-l">Em 30 dias</span><b class="kpi-v ${at(30) < 0 ? 'neg' : ''}">${money0(at(30))}</b><small>${fmtDate(pts[30].d)}</small></div>
        <div class="kpi"><span class="kpi-l">Em 90 dias</span><b class="kpi-v ${at(90) < 0 ? 'neg' : ''}">${money0(at(90))}</b><small>${fmtDate(pts[90].d)}</small></div>
        <div class="kpi"><span class="kpi-l">Menor saldo previsto</span><b class="kpi-v ${pts[minI].v < 0 ? 'neg' : ''}">${money0(pts[minI].v)}</b><small>${minI === 0 ? 'hoje' : fmtDate(pts[minI].d)}</small></div>
      </section>
      <div class="grid g-21 top">
        ${chartPanel({ id: 'fi_proj', title: 'Saldo projetado para 90 dias', sub: 'Parte do saldo de hoje e soma o que vence: parcelas, contas e recorrências ainda não lançadas' })}
        <section class="panel"><div class="panel-h"><div><h3>Próximos 30 dias</h3><p class="panel-sub">O que mexe no caixa</p></div></div>${prox.length ? `<ul class="mini-list pad-x">${prox.slice(0, 8).map((it) => `<li><div class="mini-row static"><span class="mr-main"><b>${esc(it.desc)}</b><small>${it.d === today() ? 'hoje' : fmtDate(it.d)}${it.prev ? ' · previsto' : ''}</small></span><span class="mr-side"><small class="${it.v >= 0 ? 'pos' : 'neg'}">${signedMoney0(it.v)}</small></span></div></li>`).join('')}</ul>${prox.length > 8 ? `<p class="muted small attn-more">Mais ${prox.length - 8} até ${fmtDate(pts[30].d)}.</p>` : ''}` : '<p class="muted pad">Nada vence nos próximos 30 dias.</p>'}</section>
      </div>
      ${atrasadosEntrada || atrasadosSaida ? `<p class="muted small note">${ic('alert')}A projeção considera para hoje o que já está atrasado: ${money0(atrasadosEntrada)} a receber e ${money0(atrasadosSaida)} a pagar.</p>` : ''}`;
    Charts.mount(body);
  },
};

function finRow(l) {
  const s = Calc.lancStatus(l);
  const sign = l.tipo === 'entrada' ? '+' : '−';
  const sub = [l.categoria || '', l.clienteId ? clienteNome(l.clienteId) : '', l.socio ? socioNome(l.socio) : '', l.recorrenciaId ? 'recorrente' : ''].filter(Boolean).join(' · ');
  return `<tr data-lanc="${esc(l.id)}" tabindex="0" class="${s === 'atrasado' ? 'late' : ''}"><td class="nowrap ga-date">${fmtDateShort(l.vencimento)}</td><td class="ga-main"><span class="fin-desc">${ic(l.tipo === 'entrada' ? 'in' : 'out', l.tipo === 'entrada' ? 'ic-in' : 'ic-out')}<span><b>${esc(l.descricao)}</b>${demoTag(l)}${sub ? `<small class="cell-sub">${esc(sub)}</small>` : ''}</span></span></td><td class="num ga-val ${l.tipo === 'entrada' ? 'pos' : 'neg'}">${sign}${money(l.valor)}</td><td class="ga-stat">${lancPill(l)}</td><td class="act ga-act">${!l.pagoEm ? `<button type="button" class="btn btn-sm" data-pay="${esc(l.id)}" data-write>${ic('check')}${l.tipo === 'entrada' ? 'Recebido' : 'Pago'}</button>` : ''}</td></tr>`;
}
function bindFinRows(root) {
  $$('tr[data-lanc]', root).forEach((tr) => {
    tr.addEventListener('click', (e) => { if (!e.target.closest('[data-pay]')) editLancamento(tr.dataset.lanc); });
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === tr) editLancamento(tr.dataset.lanc); });
  });
  on(root, '[data-pay]', 'click', (e, b) => { e.stopPropagation(); marcarPago(b.dataset.pay); });
}

/* ── 12-agenda-ajustes.js ── */
/* ───────────────────────── AGENDA ───────────────────────── */
const Agenda = {
  quem: 'todos',
  mount(root) {
    root.innerHTML = `<div class="vhead"><div><h1>Agenda</h1><p class="vsub" id="ag_sub"></p></div><div class="vactions"><button type="button" class="btn btn-primary" data-ntask data-write>${ic('plus')}Nova tarefa</button></div></div>
      <div class="toolbar"><div class="seg seg-sm" role="radiogroup" aria-label="Mostrar a agenda de" id="ag_quem"></div></div>
      <form class="quick-add" id="ag_quick" data-write autocomplete="off"><span class="qa-ic">${ic('plus')}</span><input id="ag_qt" placeholder="Nova tarefa rápida, depois Enter" aria-label="Nova tarefa"><select id="ag_qr" aria-label="Responsável"></select><input type="date" id="ag_qd" aria-label="Prazo"><button type="submit" class="btn">Adicionar</button></form>
      <div class="vbody" id="ag_body"></div>`;
    $('#ag_quem', root).addEventListener('click', (e) => {
      const b = e.target.closest('[role=radio]');
      if (!b) return;
      Agenda.quem = b.dataset.v;
      Agenda.render();
    });
    $('#ag_qd', root).value = today();
    $('#ag_quick', root).addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = $('#ag_qt', root);
      if (!t.value.trim()) { t.focus(); return; }
      const data = { titulo: t.value.trim(), responsavel: $('#ag_qr', root).value || S.me || 'rafael', prazo: $('#ag_qd', root).value || '', vinculo: '', notas: '', feita: false, feitaEm: null, criadoEm: nowISO(), criadoPor: S.me };
      try {
        await Store.put('tarefas', newId('tf'), data);
        t.value = '';
        toast('Tarefa adicionada.');
      } catch {}
      t.focus();
    });
    on(root, '[data-ntask]', 'click', () => editTarefa());
  },
  render() {
    const body = $('#ag_body');
    if (!body) return;
    const quemSeg = $('#ag_quem');
    quemSeg.innerHTML = [['todos', 'Todos'], ...SOCIOS.map((k) => [k, socioNome(k)])].map(([v, l]) => `<button type="button" role="radio" data-v="${v}" aria-checked="${Agenda.quem === v}">${v !== 'todos' ? avatar(v, 'xs') : ''}<span>${esc(l)}</span></button>`).join('');
    const qr = $('#ag_qr');
    const curR = qr.value || (Agenda.quem !== 'todos' ? Agenda.quem : S.me || 'rafael');
    qr.innerHTML = SOCIOS.map((k) => `<option value="${k}"${k === curR ? ' selected' : ''}>${esc(socioNome(k))}</option>`).join('');
    if (!dadosProntos()) { body.innerHTML = skeleton(); return; }
    const t = today();
    const amanha = addDays(t, 1);
    const semana = addDays(t, 7);
    const quem = Agenda.quem;
    const mine = (k) => quem === 'todos' || k === quem;
    const items = [];
    Calc.tarefasAbertas().filter((x) => mine(x.responsavel)).forEach((x) => items.push({ kind: 'tarefa', d: x.prazo || '', id: x.id, titulo: x.titulo, sub: vinculoLabel(x.vinculo), who: x.responsavel, rec: x }));
    Calc.leadsAbertos().filter((l) => l.proximoContato && mine(l.responsavel)).forEach((l) => items.push({ kind: 'follow', d: l.proximoContato, id: l.id, titulo: `Falar com ${l.empresa}`, sub: l.proximaAcao || ETAPA[l.etapa].l, who: l.responsavel, rec: l }));
    Store.all('lancamentos').filter((l) => !l.pagoEm && l.vencimento && l.vencimento <= addDays(t, 14)).forEach((l) => items.push({ kind: 'conta', d: l.vencimento, id: l.id, titulo: `${l.tipo === 'entrada' ? 'Receber' : 'Pagar'}: ${l.descricao}`, sub: money(l.valor) + (l.clienteId ? ' · ' + clienteNome(l.clienteId) : ''), rec: l }));
    const groups = [
      { k: 'atrasado', l: 'Atrasados', f: (i) => i.d && i.d < t },
      { k: 'hoje', l: 'Hoje', f: (i) => i.d === t },
      { k: 'amanha', l: 'Amanhã', f: (i) => i.d === amanha },
      { k: 'semana', l: 'Próximos 7 dias', f: (i) => i.d > amanha && i.d <= semana },
      { k: 'depois', l: 'Mais adiante', f: (i) => i.d > semana },
      { k: 'sem', l: 'Sem data', f: (i) => !i.d },
    ];
    const late = items.filter(groups[0].f).length;
    const hoje = items.filter(groups[1].f).length;
    $('#ag_sub').textContent = `${late ? plural(late, 'item atrasado', 'itens atrasados') + ' e ' : ''}${plural(hoje, 'item para hoje', 'itens para hoje')}. Contas aparecem até 14 dias antes do vencimento.`;
    const done = Store.all('tarefas').filter((x) => x.feita && x.feitaEm && x.feitaEm >= addDays(t, -7) && mine(x.responsavel)).sort((a, b) => String(b.feitaEm).localeCompare(String(a.feitaEm)));
    const rowHTML = (i) => {
      let lead = '';
      let act = '';
      const adiar = (i.kind === 'tarefa' || i.kind === 'follow') && i.d && i.d <= t ? `<button type="button" class="btn btn-sm btn-ghost" data-adiar="${i.kind}:${esc(i.id)}" data-write title="Passar para amanhã">Amanhã</button>` : '';
      if (i.kind === 'tarefa') { lead = `<button type="button" class="tick" data-tick="${esc(i.id)}" aria-label="Concluir: ${esc(i.titulo)}" data-write>${ic('check')}</button>`; act = adiar ? `<span class="ag-act">${adiar}</span>` : ''; }
      else if (i.kind === 'follow') {
        const wa = waMsgLink(i.rec.telefone, msgLead(i.rec));
        lead = `<span class="ag-ic">${ic('clock')}</span>`;
        act = `<span class="ag-act">${adiar}${wa ? `<a class="btn btn-sm btn-wa icon-only" href="${esc(wa)}" target="_blank" rel="noopener" data-wa-lead="${esc(i.id)}" aria-label="WhatsApp com mensagem pronta para ${esc(i.rec.empresa)}" title="WhatsApp com mensagem pronta">${ic('whatsapp')}</a>` : ''}<button type="button" class="btn btn-sm" data-flead="${esc(i.id)}">Registrar contato</button></span>`;
      } else {
        const cli = i.rec.tipo === 'entrada' && i.rec.clienteId ? Store.get('clientes', i.rec.clienteId) : null;
        const wa = cli ? waMsgLink(cli.telefone, msgCobranca(i.rec)) : '';
        lead = `<span class="ag-ic ${i.rec.tipo === 'entrada' ? 'in' : 'out'}">${ic(i.rec.tipo === 'entrada' ? 'in' : 'out')}</span>`;
        act = `<span class="ag-act" data-write>${wa ? `<a class="btn btn-sm btn-wa icon-only" href="${esc(wa)}" target="_blank" rel="noopener" aria-label="Cobrar ${esc(cli.nome)} no WhatsApp" title="Mensagem de cobrança no WhatsApp">${ic('whatsapp')}</a>` : ''}<button type="button" class="btn btn-sm" data-pay="${esc(i.id)}">${i.rec.tipo === 'entrada' ? 'Recebido' : 'Pago'}</button></span>`;
      }
      return `<li class="ag-i k-${i.kind}">${lead}<button type="button" class="ag-main" data-open="${i.kind}:${esc(i.id)}"><b>${esc(i.titulo)}</b>${i.sub ? `<small>${esc(i.sub)}</small>` : ''}</button><span class="ag-d ${i.d && i.d < t ? 'late' : ''}">${i.d ? esc(relDay(i.d)) : ''}</span>${i.who ? avatar(i.who, 'sm') : '<span class="av-ph"></span>'}${act || '<span class="ag-act"></span>'}</li>`;
    };
    const html = groups
      .map((g) => {
        const gi = items.filter(g.f).sort((a, b) => String(a.d).localeCompare(String(b.d)) || a.kind.localeCompare(b.kind));
        if (!gi.length) return '';
        return `<section class="ag-g g-${g.k}"><h2>${esc(g.l)} <span>${gi.length}</span></h2><ul class="ag-list">${gi.map(rowHTML).join('')}</ul></section>`;
      })
      .join('');
    body.innerHTML = (html || emptyState('Agenda livre', quem === 'todos' ? 'Nenhuma tarefa, follow-up ou conta por perto.' : `Nada pendente para ${socioNome(quem)}.`)) + (done.length ? `<details class="ag-done"><summary>Concluídas nos últimos 7 dias (${done.length})</summary><ul class="ag-list">${done.map((x) => `<li class="ag-i done"><button type="button" class="tick on" data-tick="${esc(x.id)}" aria-label="Reabrir: ${esc(x.titulo)}" data-write>${ic('check')}</button><button type="button" class="ag-main" data-open="tarefa:${esc(x.id)}"><b>${esc(x.titulo)}</b><small>concluída ${esc(relDay(x.feitaEm))}</small></button><span class="ag-d"></span>${avatar(x.responsavel, 'sm')}<span class="ag-act"></span></li>`).join('')}</ul></details>` : '');
    on(body, '[data-tick]', 'click', (e, b) => toggleTarefa(b.dataset.tick));
    on(body, '[data-flead]', 'click', (e, b) => showLead(b.dataset.flead));
    on(body, '[data-wa-lead]', 'click', (e, b) => { const l = Store.get('leads', b.dataset.waLead); if (l) registrarMsgLead(l.id, msgLeadTipo(l)); });
    on(body, '[data-adiar]', 'click', async (e, b) => {
      const [k, id] = b.dataset.adiar.split(':');
      const am = addDays(today(), 1);
      try {
        if (k === 'tarefa') await Store.patch('tarefas', id, { prazo: am, atualizadoEm: nowISO() });
        else await Store.patch('leads', id, { proximoContato: am, atualizadoEm: nowISO() });
        toast('Passou para amanhã.');
      } catch {}
    });
    on(body, '[data-pay]', 'click', (e, b) => marcarPago(b.dataset.pay));
    on(body, '[data-open]', 'click', (e, b) => {
      const [k, id] = b.dataset.open.split(':');
      if (k === 'tarefa') editTarefa(id);
      else if (k === 'follow') showLead(id);
      else editLancamento(id);
    });
  },
};

/* ───────────────────────── AJUSTES ───────────────────────── */
const Ajustes = {

  builtFrom: '',
  listas: null,

    root.innerHTML = `<div class="vhead"><div><h1>Ajustes</h1><p class="vsub">Sócios, metas, caixa, listas e backup do Prisma CRM</p></div></div><div class="vbody" id="aj_body"></div>`;

    Ajustes.builtFrom = '';

    Ajustes.renderMe();

  build(body) {

      { k: 'saldoInicial', l: 'Saldo inicial do caixa', t: 'money', hint: 'Quanto havia na conta na data abaixo' },

    const gf = buildForm(geral, gv);

function csvCell(v) {
  if (v === null || v === undefined) return '';
  const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
  return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCSV(head, rows) {
  return '﻿' + [head, ...rows].map((r) => r.map(csvCell).join(';')).join('\r\n');
}
async function saveFile(filename, content, mime) {
  if (S.mode === 'local' && S.localReason === 'file') {
    try {
      const blob = new Blob([content], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return;
    } catch {}
  }
  const dl = S.downloads;
  if (dl) {
    try {
      await dl.save({ filename, data: content });
      toast(`Arquivo ${filename} salvo.`);
      return;
    } catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') return toast('Já existe um download aguardando confirmação.', { type: 'error' });
    }
  }
  Modal.open({
    title: 'Copiar dados',
    body: `<p class="modal-text">Este acesso não permite baixar arquivos. Copie o conteúdo abaixo e cole num arquivo chamado <b>${esc(filename)}</b>.</p><textarea class="copybox" readonly rows="10">${esc(content.slice(0, 200000))}</textarea>`,
    actions: [{ label: 'Fechar', kind: 'ghost' }, { label: 'Copiar', kind: 'primary', onClick: () => copyText(content, 'Conteúdo copiado.').then(() => false) }],
  });
}
function exportar(tipo) {
  const d = today();
  if (tipo === 'json') {
    const data = { app: 'prisma-crm', versao: 1, exportadoEm: nowISO(), config: S.config };
    COLS.forEach((c) => (data[c] = Store.all(c)));
    return saveFile(`prisma-crm-backup-${d}.json`, JSON.stringify(data, null, 2), 'application/json');
  }
  if (tipo === 'leads') {
    const rows = Store.all('leads').map((l) => [l.empresa, l.contato, l.cargo, l.telefone, l.email, l.segmento, l.cidade, l.origem, (l.servicos || []).map((k) => SERVICO[k]).join(', '), +l.valor || 0, ETAPA[l.etapa] ? ETAPA[l.etapa].l : l.etapa, socioNome(l.responsavel), l.proximoContato ? fmtDate(l.proximoContato) : '', l.proximaAcao, l.motivoPerda || '', l.criadoEm ? fmtDate(String(l.criadoEm).slice(0, 10)) : '']);
    return saveFile(`prisma-crm-leads-${d}.csv`, toCSV(['Empresa', 'Contato', 'Cargo', 'Telefone', 'E-mail', 'Segmento', 'Cidade', 'Origem', 'Interesse', 'Valor estimado', 'Etapa', 'Responsável', 'Próximo contato', 'Próxima ação', 'Motivo da perda', 'Criado em'], rows), 'text/csv');
  }
  const rows = Store.all('lancamentos')
    .sort((a, b) => String(a.vencimento).localeCompare(String(b.vencimento)))
    .map((l) => [l.tipo === 'entrada' ? 'Entrada' : 'Saída', l.descricao, l.categoria, +l.valor || 0, fmtDate(l.vencimento), l.pagoEm ? fmtDate(l.pagoEm) : '', { pago: 'Pago', atrasado: 'Atrasado', pendente: 'Em aberto' }[Calc.lancStatus(l)], l.forma, l.clienteId ? clienteNome(l.clienteId) : '', projetoNome(l.projetoId), l.socio ? socioNome(l.socio) : '']);
  return saveFile(`prisma-crm-lancamentos-${d}.csv`, toCSV(['Tipo', 'Descrição', 'Categoria', 'Valor', 'Vencimento', 'Pago em', 'Status', 'Forma', 'Cliente', 'Projeto', 'Sócio'], rows), 'text/csv');
}
function progressModal(title) {
  const m = Modal.open({ title, body: `<div class="prog"><span class="meter"><i style="width:0%"></i></span><p class="muted small" id="prog_t">Preparando…</p></div>`, actions: [] });
  $('.modal-h [data-close]', m.el).hidden = true;
  $('.modal-backdrop', m.el).removeAttribute('data-close');
  return {
    set(n, total) {
      const i = $('.prog .meter i', m.el);
      if (i) i.style.width = ((n / total) * 100).toFixed(1) + '%';
      const t = $('#prog_t', m.el);
      if (t) t.textContent = `${n} de ${total}`;
    },
    close: () => m.close(),
  };
}
async function apagarExemplos() {
  const items = [];
  COLS.forEach((c) => Store.all(c).filter((r) => r.demo).forEach((r) => items.push({ op: 'remove', col: c, id: r.id })));
  if (!items.length) return;
  const ok = await confirmDialog({ title: 'Apagar os dados de exemplo?', text: `${plural(items.length, 'registro marcado', 'registros marcados')} como exemplo serão apagados. O que vocês cadastraram continua.`, confirm: 'Apagar exemplos', danger: true });
  if (!ok) return;
  const p = progressModal('Apagando exemplos');
  try {
    await Store.bulk(items, (n, t) => p.set(n, t));
    p.close();
    toast('Exemplos apagados. O CRM está pronto para os dados reais.', { ms: 6000 });
  } catch (e) {
    p.close();
    Store.writeError(e);
  }
}
async function importar(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch {
    return toast('Esse arquivo não é um backup válido do Prisma CRM.', { type: 'error' });
  }
  if (!data || data.app !== 'prisma-crm') return toast('Esse arquivo não é um backup do Prisma CRM.', { type: 'error' });
  const items = [];
  COLS.forEach((c) => (Array.isArray(data[c]) ? data[c] : []).forEach((r) => { if (r && typeof r.id === 'string' && /^[\w.~:@+-]{1,200}$/.test(r.id)) items.push({ op: 'put', col: c, id: r.id, data: r }); }));
  if (!items.length) return toast('O backup não tem registros.', { type: 'error' });
  let comConfig = true;
  const ok = await confirmDialog({
    title: 'Importar backup?',
    text: `${plural(items.length, 'registro', 'registros')} de ${data.exportadoEm ? fmtDate(String(data.exportadoEm).slice(0, 10)) : 'data desconhecida'}. Registros com o mesmo código são substituídos; os outros continuam.`,
    html: data.config ? '<label class="check" for="imp_cfg"><input type="checkbox" id="imp_cfg" checked><span>Importar também os ajustes (sócios, metas e listas)</span></label>' : '',
    confirm: 'Importar',
  });
  const cb = document.getElementById('imp_cfg');
  if (cb) comConfig = cb.checked;
  if (!ok) return;
  if (comConfig && data.config) items.push({ op: 'config', data: Store.mergeConfig(data.config) });
  const p = progressModal('Importando backup');
  try {
    await Store.bulk(items, (n, t) => p.set(n, t));
    p.close();
    toast('Backup importado.');
  } catch (e) {
    p.close();
    Store.writeError(e);
  }
}

  manutencao: { l: 'Plano de manutenção', quando: 'Projeto entregue, cliente sem mensalidade' },
};
const MSG_VARS = [
  ['{contato}', 'primeiro nome do contato'],
  ['{empresa}', 'empresa'],
  ['{eu}', 'quem está usando o CRM'],
  ['{servico}', 'interesse do lead'],

];

function preencher(tpl, ctx) {
  return String(tpl || '')
    .replace(/\{(\w+)\}/g, (m, k) => (ctx[k] !== undefined && ctx[k] !== null ? String(ctx[k]) : ''))
    .replace(/,\s*!/g, '!')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/ +([.,!?])/g, '$1')
    .trim();
}
function servicoTexto(arr) {
  const m = { site: 'um site', automacao: 'automação', sistema: 'um sistema', outro: 'soluções digitais' };
  const xs = (arr || []).map((k) => m[k]).filter(Boolean);
  if (!xs.length) return 'soluções digitais';
  return xs.length === 1 ? xs[0] : `${xs.slice(0, -1).join(', ')} e ${xs[xs.length - 1]}`;
}
function vencTexto(d) {
  if (!d) return '';
  const r = relDay(d);
  return /^\d/.test(r) ? `em ${fmtDate(d).slice(0, 5)}` : r;
}
function ctxBase(dono) {
  const pix = String(cfg().pix || '').trim();
  return { eu: S.me ? meNome() : socioNome(dono || 'pedro'), pix: pix ? `Chave Pix: ${pix}. ` : '' };
}
function msgLeadTipo(l) {
  if (l.etapa === 'novo') return 'primeiroContato';
  if (l.etapa === 'proposta') return 'proposta';
  if (l.etapa === 'negociacao') return 'fechamento';
  return 'followup';
}
function msgLead(l, tipo = msgLeadTipo(l)) {
  return preencher(cfg().msgs[tipo], Object.assign(ctxBase(l.responsavel), { contato: primeiroNome(l.contato), empresa: l.empresa, servico: servicoTexto(l.servicos) }));
}
function msgCobranca(l, tipo) {
  const c = Store.get('clientes', l.clienteId);
  const p = Store.get('projetos', l.projetoId);
  const k = tipo || (l.vencimento && l.vencimento < today() ? 'atraso' : 'cobranca');
  return preencher(cfg().msgs[k], Object.assign(ctxBase(p && p.vendedor), { contato: primeiroNome(c && c.contato), empresa: c ? c.nome : '', descricao: l.descricao, valor: money(l.valor), vencimento: vencTexto(l.vencimento), projeto: p ? p.titulo : '' }));
}
function msgProjeto(p, tipo) {
  const c = Store.get('clientes', p.clienteId);
  return preencher(cfg().msgs[tipo], Object.assign(ctxBase(p.vendedor), { contato: primeiroNome(c && c.contato), empresa: c ? c.nome : '', projeto: p.titulo }));
}

/* ao mudar de etapa: agenda o próximo contato com a ação da etapa (não mexe em contato já marcado para depois de hoje) */
function followupAuto(l, stage) {
  const A = cfg().auto;
  if (!A.followupEtapa || !ABERTAS.includes(stage)) return null;
  const t = today();
  if (l.proximoContato && l.proximoContato > t) return null;
  const dias = A.prazosEtapa[stage] ?? 2;
  return { proximoContato: addDiasUteis(t, dias), proximaAcao: A.acoesEtapa[stage] || '' };
}
function logFollowup(l, fu) {
  Store.logAuto({ tipo: 'followup', txt: `Agendou contato com ${l.empresa} para ${relDay(fu.proximoContato) === 'hoje' ? 'hoje' : fmtDateShort(fu.proximoContato)}: ${fu.proximaAcao || 'follow-up'}`, ref: `lead:${l.id}` });
}

/* ao fechar venda: tarefas do projeto para quem executa, com prazos até a entrega */
async function checklistVenda(pid, v, demo = {}) {
  const A = cfg().auto;
  if (!A.checklistVenda) return 0;
  const itens = (A.checklist[v.servico] || []).filter(Boolean);
  if (!itens.length) return 0;
  const ini = v.dataFechamento && v.dataFechamento > today() ? v.dataFechamento : today();
  const fim = v.prazo && v.prazo > ini ? v.prazo : addDiasUteis(ini, 15);
  const span = Math.max(itens.length, daysBetween(ini, fim));
  const quem = SOCIOS.includes(v.executor) ? v.executor : 'rafael';
  let n = 0;
  for (let i = 0; i < itens.length; i++) {
    const prazo = i === itens.length - 1 ? fim : addDiasUteis(addDays(ini, Math.max(1, Math.round((span * (i + 1)) / itens.length))), 0);
    await Store.put('tarefas', `auto_ck_${pid}_${i}`, { titulo: itens[i], responsavel: quem, prazo: prazo > fim ? fim : prazo, vinculo: `projeto:${pid}`, notas: '', feita: false, feitaEm: null, criadoEm: nowISO(), criadoPor: S.me, auto: 'checklist', ...demo });
    n++;
  }
  Store.logAuto({ tipo: 'checklist', txt: `Criou ${plural(n, 'tarefa', 'tarefas')} do projeto ${v.titulo} para ${socioNome(quem)}, até ${fmtDateShort(fim)}`, ref: `projeto:${pid}` });
  return n;
}

/* ao entregar: depoimento, manutenção (se o cliente não tem) e saldo em aberto */
async function posEntrega(pid) {
  if (!cfg().auto.posEntrega) return 0;
  const p = Store.get('projetos', pid);
  if (!p) return 0;
  const c = Store.get('clientes', p.clienteId);
  const nome = c ? c.nome : p.titulo;
  const quem = SOCIOS.includes(p.vendedor) ? p.vendedor : 'pedro';
  const t = today();
  const f = Calc.projetoFin(p);
  const itens = [{ k: 'depoimento', titulo: `Pedir depoimento e indicação: ${nome}`, prazo: addDiasUteis(t, 2) }];
  const temMensal = Store.all('recorrencias').some((r) => r.ativo && r.tipo === 'entrada' && (r.projetoId === pid || (p.clienteId && r.clienteId === p.clienteId)));
  if (!temMensal) itens.push({ k: 'manutencao', titulo: `Oferecer plano de manutenção: ${nome}`, prazo: addDiasUteis(t, 5) });
  const saldo = f.ls.filter((l) => !l.pagoEm && /saldo/i.test(l.descricao || ''));
  if (saldo.length) itens.push({ k: 'saldo', titulo: `Cobrar o saldo da entrega (${money(sum(saldo, (l) => l.valor))}): ${nome}`, prazo: t });
  if (f.semParcela > 0) itens.push({ k: 'parcela', titulo: `Lançar ${money(f.semParcela)} do projeto que ainda não tem parcela: ${p.titulo}`, prazo: t });
  const demo = herdaDemo({ projetoId: pid });
  let n = 0;
  for (const it of itens) {
    const id = `auto_pe_${pid}_${it.k}`;
    if (Store.get('tarefas', id)) continue;
    await Store.put('tarefas', id, { titulo: it.titulo, responsavel: quem, prazo: it.prazo, vinculo: `projeto:${pid}`, notas: '', feita: false, feitaEm: null, criadoEm: nowISO(), criadoPor: S.me, auto: 'posEntrega', ...demo });
    n++;
  }
  if (n) Store.logAuto({ tipo: 'posEntrega', txt: `${p.titulo} foi entregue: criou ${plural(n, 'tarefa', 'tarefas')} de pós-venda para ${socioNome(quem)}`, ref: `projeto:${pid}` });
  return n;
}
async function mudarStatusProjeto(id, status, extra = {}) {
  const p = Store.get('projetos', id);
  if (!p) return;
  const ch = { status, atualizadoEm: nowISO(), ...extra };

}

/* ── motor das automações de calendário (rodam com o CRM aberto, numa aba por vez) ── */
const Auto = {
  timer: null,
  rodando: false,
  ultima: 0,
  feitas: 0,
  agendar(ms = 1500) {
    clearTimeout(Auto.timer);
    Auto.timer = setTimeout(() => {
      Auto.rodar().catch((e) => console.warn('piloto automático', e));
    }, ms);
  },
  pronto() {
    if (S.readOnly || S.fatal) return false;
    return S.mode === 'local' || (S.mode === 'cloud' && S.ready);
  },
  impostoPlano() {
    const A = cfg().auto;
    if (A.imposto === 'off') return null;
    const comp = monthAdd(thisMonth(), -1);
    const id = `imp_${comp}`;
    let base = 0;
    let valor = 0;
    if (A.imposto === 'simples') {
      base = round2(sum(Store.all('lancamentos').filter((l) => l.tipo === 'entrada' && !l.demo && l.pagoEm && monthOf(l.pagoEm) === comp), (l) => l.valor));
      valor = round2((base * (+A.impostoPct || 0)) / 100);
    } else valor = round2(+A.impostoValor || 0);
    if (!(valor > 0)) return null;
    const cur = Store.get('lancamentos', id);
    const nomeMes = monthLabel(comp).toLowerCase();
    const plano = {
      id,
      comp,
      valor,
      descricao: `DAS ${A.imposto === 'mei' ? 'MEI' : 'Simples Nacional'} · ${nomeMes}`,
      notas: A.imposto === 'simples' ? `Calculado pelo piloto automático: ${fmtNum(A.impostoPct, 2)}% sobre ${money(base)} recebidos em ${nomeMes}.` : 'Valor fixo do DAS MEI, lançado pelo piloto automático.',
      cur,
    };
    const ajustar = cur && !cur.pagoEm && cur.auto === 'imposto' && Math.abs((+cur.valor || 0) - (+cur.valorAuto || 0)) < 0.005 && Math.abs(cur.valor - valor) >= 0.01;
    if (cur && !ajustar) return null;
    if (!cur && S.autoEstado.feitos && S.autoEstado.feitos[`imp:${comp}`] && !Auto.estadoNovo) return null;
    plano.ajustar = !!ajustar;
    return plano;
  },
  plano() {
    const A = cfg().auto;
    const t = today();
    return {
      recorrencias: A.recorrencias ? Calc.recPendentes(thisMonth()) : [],
      parados: A.leadParado ? Calc.leadsAbertos().filter((l) => Calc.leadParado(l, A.diasParado, t) && !(l.paradoAviso && daysBetween(l.paradoAviso, t) < A.diasParado)) : [],
      imposto: Auto.impostoPlano(),
    };
  },
  temTrabalho(p) {
    return p.recorrencias.length > 0 || p.parados.length > 0 || !!p.imposto;
  },
  async rodar(forcar = false) {
    if (Auto.rodando || !Auto.pronto()) return;
    const agora = Date.now();
    if (!forcar && agora - Auto.ultima < 15000) return Auto.agendar(15000 - (agora - Auto.ultima) + 50);
    if (!Auto.temTrabalho(Auto.plano())) return;
    Auto.rodando = true;
    Auto.ultima = agora;
    const feito = { rec: [], imp: null, parados: [] };
    try {
      if (!(await Store.trava(45000))) return;
      const est = await Store.lerEstado();
      Auto.estadoNovo = false;
      const p = Auto.plano();
      const m = thisMonth();
      // 1) recorrências do mês
      for (const r of p.recorrencias) {
        try {
          if (await criarSeNaoExiste('lancamentos', Calc.recLancId(r.id, m), corpoRecorrencia(r, m))) feito.rec.push(r);
        } catch (e) {
          console.warn('recorrência não lançada', r.id, e);
          break;
        }
      }
      // 2) imposto da competência anterior
      const x = p.imposto;
      if (x && !(est.feitos[`imp:${x.comp}`] && !x.cur)) {
        try {
          const cat = cfg().categoriasSaida.find((c) => /imposto/i.test(c)) || 'Impostos & taxas';
          if (x.ajustar) {
            await Store.patch('lancamentos', x.id, { valor: x.valor, valorAuto: x.valor, notas: x.notas, atualizadoEm: nowISO() });
            feito.imp = { ...x, ajustado: true };
          } else if (await criarSeNaoExiste('lancamentos', x.id, { tipo: 'saida', descricao: x.descricao, valor: x.valor, valorAuto: x.valor, categoria: cat, vencimento: dateInMonth(m, cfg().auto.impostoDia), pagoEm: null, forma: 'Boleto', clienteId: null, projetoId: null, competencia: x.comp, auto: 'imposto', notas: x.notas, criadoEm: nowISO(), criadoPor: S.me })) {
            feito.imp = x;
          }
          est.feitos[`imp:${x.comp}`] = today();
        } catch (e) {
          console.warn('imposto não lançado', e);
        }
      }
      // 3) leads parados viram contato para hoje
      const t = today();
      for (const l0 of p.parados) {
        const l = Store.get('leads', l0.id);
        if (!l || !Calc.leadParado(l, cfg().auto.diasParado, t)) continue;
        const d = Calc.diasNaEtapa(l);
        const agoraIso = nowISO();
        try {
          await Store.patch('leads', l.id, {
            proximoContato: t,
            proximaAcao: `Retomar o contato (parado há ${d} dias)`,
            paradoAviso: t,
            historico: [...(l.historico || []), { tipo: 'auto', texto: `Parado há ${d} dias em ${ETAPA[l.etapa].l.toLowerCase()}: contato agendado para hoje`, data: agoraIso, autor: null }],
          });
          feito.parados.push({ l, d });
        } catch (e) {
          console.warn('lead parado não reagendado', l.id, e);
          break;
        }
      }
      // estado e histórico
      const algo = feito.rec.length || feito.imp || feito.parados.length;
      if (algo || p.imposto) {
        for (const [k, v] of Object.entries(est.feitos)) if (daysBetween(String(v).slice(0, 10), t) > 400) delete est.feitos[k];
        est.ultimaRodada = nowISO();
        est.por = S.me || null;
        try { await Store.gravarEstado(est); } catch (e) { console.warn('estado do piloto não salvo', e); }
      }
      if (feito.rec.length) Store.logAuto({ tipo: 'recorrencias', txt: `Lançou ${plural(feito.rec.length, 'recorrência', 'recorrências')} de ${MESES[+m.slice(5, 7) - 1]} no caixa: ${feito.rec.map((r) => r.descricao).slice(0, 4).join(', ')}${feito.rec.length > 4 ? '…' : ''}`, ref: 'fin:recorrencias' });
      if (feito.imp) Store.logAuto({ tipo: 'imposto', txt: feito.imp.ajustado ? `Atualizou o ${feito.imp.descricao} para ${money(feito.imp.valor)}` : `Lançou o ${feito.imp.descricao}: ${money(feito.imp.valor)}, vence dia ${cfg().auto.impostoDia}`, ref: `lanc:${feito.imp.id}` });
      for (const { l, d } of feito.parados) Store.logAuto({ tipo: 'parado', txt: `${l.empresa} estava parado há ${d} dias: contato agendado para hoje com ${socioNome(l.responsavel)}`, ref: `lead:${l.id}` });
      const partes = [];
      if (feito.rec.length) partes.push(`${plural(feito.rec.length, 'recorrência lançada', 'recorrências lançadas')} no caixa`);
      if (feito.imp) partes.push(feito.imp.ajustado ? 'DAS atualizado' : 'DAS do mês lançado');
      if (feito.parados.length) partes.push(`${plural(feito.parados.length, 'lead parado voltou', 'leads parados voltaram')} para a agenda`);
      if (partes.length) {
        Auto.feitas += partes.length;
        toast(`Piloto automático: ${partes.join(', ')}.`, { action: 'Ver', ms: 6000, onAction: () => go('piloto') });
      }
    } finally {
      Auto.rodando = false;
    }
  },
  iniciar() {
    // primeira rodada logo depois que os dados chegam; depois a cada 5 minutos, ao voltar para a aba e na virada do dia
    let primeira = true;
    Store.subscribe(() => {
      if (primeira && Auto.pronto()) {
        primeira = false;
        Auto.estadoNovo = S.mode === 'cloud';
        Auto.agendar(1200);
      }
    });
    setInterval(() => Auto.agendar(300), 5 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Auto.agendar(800); });
  },
};

const PROVEDORES = /^(gmail|googlemail|hotmail|outlook|live|msn|yahoo|ymail|icloud|me|bol|uol|terra|ig|globo|r7|proton|protonmail|zoho|aol)\./i;
function lerMensagem(txt) {
  const t = String(txt || '').replace(/\r/g, '').trim();
  const out = { campos: [] };
  if (!t) return out;
  const put = (k, v) => {
    const s = String(v || '').trim().replace(/^[\s"'“”*_-]+|[\s"'“”*_,.;:!-]+$/g, '');
    if (s && !out[k]) { out[k] = s; out.campos.push(k); }
  };
  const kv = (re) => { const m = t.match(re); return m ? m[1] : ''; };
  // formulário do site ou e-mail com "Campo: valor"
  let form = 0;
  const fk = (k, re) => { const v = kv(re); if (v) { form++; put(k, v); } };
  fk('empresa', /^\s*\**(?:empresa|company|nome da empresa|neg[óo]cio|raz[ãa]o social|loja|marca)\**\s*[:=]\s*(.+)$/im);
  fk('contato', /^\s*\**(?:nome(?: completo)?|seu nome|name|contato|respons[áa]vel)\**\s*[:=]\s*(.+)$/im);
  fk('email', /^\s*\**e-?mail\**\s*[:=]\s*(\S+@\S+)/im);
  fk('telefone', /^\s*\**(?:telefone|celular|whats(?:app)?|fone|tel)\**\s*[:=]\s*([+\d()\s.-]{8,})$/im);
  fk('cidade', /^\s*\**(?:cidade|localiza[çc][ãa]o)\**\s*[:=]\s*(.+)$/im);
  fk('segmento', /^\s*\**(?:segmento|ramo|setor|[áa]rea de atua[çc][ãa]o)\**\s*[:=]\s*(.+)$/im);
  fk('site', /^\s*\**(?:site|website|instagram|insta)\**\s*[:=]\s*(\S+)/im);
  // conversa exportada ou copiada do WhatsApp: "[16/11/2026 10:32] João Silva: ..." ou "16/11/2026 10:32 - João Silva: ..."
  const wa = t.match(/^\[?\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*(?:-\s*)?([^:\n]{2,40}):/m);
  if (wa && !/^\+?\d[\d\s()-]+$/.test(wa[1].trim())) put('contato', wa[1]);
  // frases soltas
  const nomeRe = '([A-ZÀ-Ý][a-zà-ÿ]+(?:\\s+[A-ZÀ-Ý][a-zà-ÿ]+)?)';
  const apres = '(?:[Mm]eu nome [ée]\\s+|[Mm]e chamo\\s+|[Aa]qui [ée]\\s+(?:o\\s+|a\\s+)?|[Ss]ou\\s+(?:o|a)\\s+)';
  put('contato', kv(new RegExp('\\b' + apres + nomeRe)));
  const pal = "[A-ZÀ-Ý0-9][\\wÀ-ÿ&'’-]*(?:\\.[\\wÀ-ÿ]+)*";
  const empRe = '(' + pal + '(?:\\s+(?:d[aeo]s?\\s+|&\\s+)?' + pal + '){0,3})';
  put('empresa', kv(new RegExp('\\b(?:da empresa|na empresa|a empresa|empresa)\\s+' + empRe)));
  put('empresa', kv(new RegExp('\\b' + apres + '[A-ZÀ-Ý][a-zà-ÿ]+(?:\\s+[A-ZÀ-Ý][a-zà-ÿ]+)?,?\\s+d[aoe]\\s+' + empRe)));
  const cargoM = t.match(new RegExp('\\b([Dd]on[oa]|[Pp]ropriet[áa]ri[oa]|[Gg]erente|[Ss][óo]ci[oa]|[Dd]iretora?|[Cc]oordenadora?|[Rr]espons[áa]vel)\\s+d[aoe]\\s+' + empRe));
  if (cargoM) { put('cargo', cap(cargoM[1].toLowerCase())); put('empresa', cargoM[2]); }
  put('empresa', kv(new RegExp('\\b(?:[Ss]ou d[aoe]|[Tt]rabalho n[ao]|[Rr]epresento [ao]|[Ff]alo d[aoe]|[Tt]enho (?:um|uma) [a-zà-ÿ]+ chamad[ao])\\s+' + empRe)));
  // contatos em qualquer lugar do texto
  const em = t.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/);
  if (em) put('email', em[0].toLowerCase());
  const semEmail = em ? t.replace(em[0], ' ') : t;
  const tels = semEmail.match(/(?:\+?55[\s.-]*)?\(?\b[1-9]\d\)?[\s.-]*(?:9[\s.-]?)?\d{4}[\s.-]?\d{4}\b/g) || [];
  const tel = tels.find((x) => { const d = digits(x).replace(/^55(?=\d{10,11}$)/, ''); return d.length === 10 || d.length === 11; });
  if (tel) put('telefone', tel);
  const ig = semEmail.match(/(?:^|[\s(])@([A-Za-z0-9_.]{3,30})\b/);
  const url = semEmail.match(/\b(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com\.br|com|net\.br|net|org\.br|org|br|io|app|site|store|online|shop|dev)(?:\/[^\s)]*)?/i);
  if (url && !/wa\.me|whatsapp\.com/i.test(url[0])) put('site', url[0]);
  else if (ig) put('site', '@' + ig[1]);

  if (!out.empresa && em) {
    const dom = em[0].split('@')[1];
    if (!PROVEDORES.test(dom)) {

  // interesse
  const n = norm(t);
  const serv = [];

  if (/\b(automacao|automacoes|automatizar|automatizado|automatica|automatico|chat ?bot|bot|robo|integracao|integrar|n8n|zapier|disparo)\b/.test(n)) serv.push('automacao');
  if (/\b(sistema|sistemas|software|aplicativo|app|plataforma|erp|crm|portal|painel|dashboard)\b/.test(n)) serv.push('sistema');
  if (serv.length) { out.servicos = serv; out.campos.push('servicos'); }
  // valor
  let valor = NaN;
  const vr = t.match(/R\$\s*([\d.]+(?:,\d{1,2})?)(\s*mil\b)?/i);
  if (vr) valor = parseMoney(vr[1]) * (vr[2] ? 1000 : 1);
  if (isNaN(valor)) {
    const vm = n.match(/\b(\d+(?:[.,]\d+)?)\s*mil\b/);
    if (vm) valor = parseFloat(vm[1].replace(',', '.')) * 1000;
  }
  if (isNaN(valor)) {
    const vo = n.match(/orcamento[^\d\n]{0,25}(\d[\d.,]{2,})/);
    if (vo) valor = parseMoney(vo[1]);
  }
  if (valor > 0 && valor < 10000000) { out.valor = round2(valor); out.campos.push('valor'); }
  // origem
  const origens = cfg().origens;
  const tem = (o) => origens.find((x) => norm(x) === norm(o));
  if (wa && tem('WhatsApp')) out.origem = tem('WhatsApp');
  else if (form >= 2 && tem('Site da Prisma')) out.origem = tem('Site da Prisma');
  else if (/\bindica(cao|do|da|ou)\b/.test(n) && tem('Indicação')) out.origem = tem('Indicação');
  else if (/\binstagram|\binsta\b|\bdirect\b/.test(n) && tem('Instagram')) out.origem = tem('Instagram');
  else if (/\blinkedin\b/.test(n) && tem('LinkedIn')) out.origem = tem('LinkedIn');
  else if (/\bgoogle\b/.test(n) && tem('Google')) out.origem = tem('Google');

  out.notas = t.slice(0, 2000);
  return out;
}
const CAMPO_NOME = { empresa: 'empresa', contato: 'contato', cargo: 'cargo', telefone: 'telefone', email: 'e-mail', cidade: 'cidade', segmento: 'segmento', site: 'site', servicos: 'interesse', valor: 'valor', origem: 'origem' };
function aplicarMensagem(el, fid, dados) {
  const preenchidos = [];
  const setv = (k, v) => {
    const inp = fieldEl(el, fid, k);
    if (!inp || v === undefined || v === null || v === '') return;
    if (inp.value && inp.value.trim() && k !== 'notas') return;
    inp.value = k === 'valor' ? moneyInputValue(v) : v;
    const wrap = inp.closest('.field');
    if (wrap) { wrap.classList.remove('filled'); void wrap.offsetWidth; wrap.classList.add('filled'); }
    if (k !== 'notas') preenchidos.push(CAMPO_NOME[k] || k);
  };
  ['empresa', 'contato', 'telefone', 'email', 'cidade', 'segmento', 'site', 'valor'].forEach((k) => setv(k, dados[k]));
  if (dados.origem) {
    const sel = fieldEl(el, fid, 'origem');
    if (sel && !sel.value) { sel.value = dados.origem; preenchidos.push('origem'); }
  }
  if (dados.servicos && dados.servicos.length) {
    const box = fieldEl(el, fid, 'servicos');
    if (box && !$('.chip[aria-pressed="true"]', box)) {
      dados.servicos.forEach((k) => { const c = $(`.chip[data-v="${k}"]`, box); if (c) c.setAttribute('aria-pressed', 'true'); });
      preenchidos.push('interesse');
    }
  }
  const notas = fieldEl(el, fid, 'notas');
  if (notas && dados.notas && !notas.value.includes(dados.notas.slice(0, 40))) notas.value = (notas.value ? notas.value + '\n\n' : '') + `Mensagem recebida:\n${dados.notas}`;
  if (dados.cargo) setv('cargo', dados.cargo);
  const grid = $('.form-grid', el);
  if (grid && !grid.classList.contains('show-more') && (['email', 'cidade', 'segmento', 'site', 'cargo', 'notas'].some((k) => dados[k]))) {
    grid.classList.add('show-more');
    const b = $('[data-more-toggle]', el);
    if (b) { b.setAttribute('aria-expanded', 'true'); $('span', b).textContent = 'Menos detalhes'; }
  }
  if (grid) grid.dispatchEvent(new Event('input', { bubbles: true }));
  return preenchidos;
}

function bindColar(el, fid) {
  const box = $(`#${fid}_pastebox`, el);

function extratoBotao(cls = 'btn') {

function hashTxt(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
async function lerArquivoTexto(file) {
  const buf = await file.arrayBuffer();
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch {
    return new TextDecoder('windows-1252').decode(buf);
  }
}
function lerData(s) {
  const v = String(s || '').trim();
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = v.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/);
  if (m) {
    let y = +m[3];
    if (y < 100) y += 2000;
    if (+m[2] < 1 || +m[2] > 12 || +m[1] < 1 || +m[1] > 31) return '';
    return `${y}-${pad(+m[2])}-${pad(+m[1])}`;
  }
  return '';
}
function lerOFX(txt) {
  const out = [];
  for (const b of txt.split(/<STMTTRN>/i).slice(1)) {
    const g = (tag) => {
      const m = b.match(new RegExp('<' + tag + '>\\s*([^<\\r\\n]+)', 'i'));
      return m ? m[1].trim() : '';
    };
    const dt = g('DTPOSTED');
    const valor = parseMoney(g('TRNAMT'));
    if (!/^\d{8}/.test(dt) || isNaN(valor) || !valor) continue;
    const desc = [g('NAME'), g('MEMO')].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(' · ') || 'Movimentação do banco';
    out.push({ data: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, valor: round2(valor), desc: desc.replace(/\s+/g, ' '), fid: g('FITID') });
  }
  return out;
}
function splitCSV(line, sep) {
  const out = [];
  let cur = '';
  let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else q = false;
      } else cur += c;
    } else if (c === '"') q = true;
    else if (c === sep) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map((x) => x.trim());
}
function lerCSV(txt) {
  const linhas = txt.replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim());
  if (linhas.length < 2) return [];
  let hi = linhas.findIndex((l) => /\b(data|date)\b/.test(norm(l)) && /(valor|amount|value|credito|debito|quantia)/.test(norm(l)));
  if (hi < 0) hi = 0;
  const head = linhas[hi];
  const sep = [';', ',', '\t'].map((c) => [c, head.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const H = splitCSV(head, sep).map((h) => norm(h).replace(/["']/g, '').trim());
  const acha = (res, evitar = []) => {
    for (const re of res) {
      const i = H.findIndex((h, j) => re.test(h) && !evitar.includes(j));
      if (i >= 0) return i;
    }

  const cDesc = acha([/descri/, /^title\b|titulo/, /histor/, /memo|estabelecimento|detalhe|lancamento|identific/], [cData, cValor, cCred, cDeb]);

      const db = cDeb >= 0 ? parseMoney(c[cDeb]) : NaN;
      valor = (isNaN(cr) ? 0 : Math.abs(cr)) - (isNaN(db) ? 0 : Math.abs(db));

    if (isNaN(valor) || !valor) continue;

function catPalpite(tipo, desc) {

    if (/pro.?labore|retirada/.test(n)) return tem(/pro.?labore|retirada/) || cats[cats.length - 1];

}
/* junta cada movimentação com o lançamento em aberto de mesmo valor e data mais próxima */
function casarExtrato(txs) {
  const todos = Store.all('lancamentos').filter((l) => !l.demo);
  const abertos = todos.filter((l) => !l.pagoEm);
  const pagos = todos.filter((l) => l.pagoEm);
  const importados = new Set(todos.map((l) => l.extratoId).filter(Boolean));
  const usados = new Set();
  const vistos = new Set();
  return txs
    .slice()
    .sort((a, b) => a.data.localeCompare(b.data))
    .map((tx) => {
      const tipo = tx.valor > 0 ? 'entrada' : 'saida';
      const v = Math.abs(tx.valor);
      let id = tx.fid ? `ofx_${tx.fid}` : `csv_${hashTxt(`${tx.data}|${tx.valor}|${norm(tx.desc)}`)}`;
      while (vistos.has(id)) id += '_';
      vistos.add(id);
      const row = { tx, id, tipo, v, cat: catPalpite(tipo, tx.desc) };
      if (importados.has(id)) return Object.assign(row, { acao: 'ja', motivo: 'importada antes' });
      const cands = abertos
        .filter((l) => l.tipo === tipo && !usados.has(l.id) && Math.abs((+l.valor || 0) - v) < 0.01)
        .map((l) => ({ l, dist: Math.abs(daysBetween(l.vencimento || tx.data, tx.data)) }))
        .filter((c) => c.dist <= 45)
        .sort((a, b) => a.dist - b.dist);
      if (cands.length) {
        usados.add(cands[0].l.id);
        return Object.assign(row, { acao: `baixa:${cands[0].l.id}`, opcoes: cands.map((c) => c.l) });
      }
      const pago = pagos.find((l) => l.tipo === tipo && !l.extratoId && !usados.has(l.id) && Math.abs((+l.valor || 0) - v) < 0.01 && Math.abs(daysBetween(l.pagoEm, tx.data)) <= 5);
      if (pago) {
        usados.add(pago.id);
        return Object.assign(row, { acao: 'ja', motivo: `já marcado: ${pago.descricao}` });
      }
      return Object.assign(row, { acao: 'ignorar', opcoes: [] });
    });
}

      <ul class="ex-list">${rows.map(linha).join('')}</ul>`,

/* ── .zip mínimo: o iPhone exporta a conversa como um .zip com o _chat.txt dentro ── */
async function inflarRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function lerZipTextos(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip inválido');
  const total = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let k = 0; k < total; k++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(p + 10, true);
    const tam = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true);
    const xl = dv.getUint16(p + 30, true);
    const cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    if (!/\.txt$/i.test(nome) || /(^|\/)__MACOSX\//.test(nome)) continue;
    if (dv.getUint32(off, true) !== 0x04034b50) continue;
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const dados = u8.subarray(ini, ini + tam);
    const bytes = metodo === 0 ? dados : metodo === 8 ? await inflarRaw(dados) : null;
    if (bytes) out.push({ nome, texto: new TextDecoder('utf-8').decode(bytes) });
  }
  return out;
}

/* ── leitura do texto exportado (iPhone e Android, em português ou inglês) ── */
const WA_INVISIVEIS = /[‎‏‪-‮⁦-⁩﻿]/g;
const WA_MIDIA = /^(<?m[ií]dia oculta>?|<media omitted>|imagem ocultada|image omitted|[áa]udio ocultado|audio omitted|v[íi]deo omitido|video omitted|figurinha omitida|sticker omitted|documento omitido|document omitted|gif omitido|gif omitted|cart[ãa]o de contato omitido|contact card omitted)$/i;
const WA_APAGADA = /^(mensagem apagada|esta mensagem foi apagada|voc[eê] apagou esta mensagem|this message was deleted|you deleted this message)$/i;
function lerConversa(texto, arquivo) {
  const linhas = String(texto || '').replace(WA_INVISIVEIS, '').replace(/[  ]/g, ' ').split(/\r?\n/);
  const reIos = /^\[(\d{1,2})[./-](\d{1,2})[./-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?(?:\s*([AaPp])\.?\s*[Mm]\.?)?\]\s*([^:]{1,60}?):\s?(.*)$/;
  const reAndroid = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?(?:\s*([AaPp])\.?\s*[Mm]\.?)?\s+-\s+([^:]{1,60}?):\s?(.*)$/;
  const reSistema = /^\[?\d{1,2}[./-]\d{1,2}[./-]\d{2,4},?\s+\d{1,2}:\d{2}/;
  const brutas = [];
  for (const l of linhas) {
    const m = l.match(reIos) || l.match(reAndroid);
    if (m) {
      brutas.push({ a: +m[1], b: +m[2], y: +m[3], hh: +m[4], mm: +m[5], ampm: m[6], autor: m[7].trim(), texto: m[8] });
      continue;
    }
    if (reSistema.test(l)) { brutas.push(null); continue; }
    const ult = brutas[brutas.length - 1];
    if (ult && l.trim()) ult.texto += '\n' + l;
  }
  const validas = brutas.filter(Boolean);
  if (!validas.length) return null;
  const diaPrimeiro = validas.some((x) => x.a > 12) || !validas.some((x) => x.b > 12);
  const msgs = [];
  for (const x of validas) {
    const dia = diaPrimeiro ? x.a : x.b;
    const mes = diaPrimeiro ? x.b : x.a;
    if (mes < 1 || mes > 12 || dia < 1 || dia > 31) continue;
    const ano = x.y < 100 ? 2000 + x.y : x.y;
    let h = x.hh;
    if (x.ampm) {
      const pm = /p/i.test(x.ampm);
      if (pm && h < 12) h += 12;
      if (!pm && h === 12) h = 0;
    }
    let t = x.texto.trim();
    if (WA_MIDIA.test(t) || /^<(anexado|attached):/i.test(t)) t = '[mídia]';
    if (!t || WA_APAGADA.test(t)) continue;
    msgs.push({ d: `${ano}-${pad(mes)}-${pad(dia)}`, h: `${pad(h)}:${pad(x.mm)}`, autor: x.autor, texto: t });
  }
  if (!msgs.length) return null;
  // quem é quem
  const base = String(arquivo || '').replace(/\.(txt|zip)$/i, '').trim();
  const fm = base.match(/^(?:conversa do whatsapp|conversa de whatsapp|whatsapp chat|chat de whatsapp|conversa)\s*(?:com|with|con|-|–|:)?\s*(.+)$/i);
  const nomeArq = fm ? fm[1].trim() : /^_?chat$/i.test(base) ? '' : base;
  const cont = new Map();
  msgs.forEach((m) => cont.set(m.autor, (cont.get(m.autor) || 0) + 1));
  const autores = [...cont.entries()].sort((a, b) => b[1] - a[1]).map(([nome, n]) => ({ nome, n }));
  const ehSocio = (nome) => SOCIOS.some((s) => { const p = norm(primeiroNome(socioNome(s))); return p && norm(nome).split(/\s+/).includes(p); }) || /\bprisma\b/.test(norm(nome));
  const ehArquivo = (nome) => nomeArq && (norm(nome) === norm(nomeArq) || (digits(nomeArq).length >= 10 && digits(nome).endsWith(digits(nomeArq).slice(-8))));
  let prisma = autores.filter((a) => !ehArquivo(a.nome) && (ehSocio(a.nome) || (nomeArq && autores.some((b) => ehArquivo(b.nome))))).map((a) => a.nome);
  if (!prisma.length) prisma = autores.filter((a) => ehSocio(a.nome)).map((a) => a.nome);
  const cliente = autores.find((a) => !prisma.includes(a.nome));
  const clienteNome = cliente ? cliente.nome : nomeArq;
  const telDe = (s) => { const d = digits(s).replace(/^55(?=\d{10,11}$)/, ''); return d.length === 10 || d.length === 11 ? s.trim() : ''; };
  const telefone = telDe(nomeArq) || (cliente ? telDe(cliente.nome) : '');
  const hash = hashTxt(msgs.slice(0, 5).map((m) => `${m.d}${m.h}${m.autor}${m.texto}`).join('|'));
  return { arquivo: base, nomeArq, msgs, autores, prisma, clienteNome: telDe(clienteNome) ? '' : clienteNome, telefone, primeira: msgs[0].d, ultima: msgs[msgs.length - 1].d, hash };
}
function transcrever(c, max = 40000) {
  const fmt = (m) => `${m.d.slice(8, 10)}/${m.d.slice(5, 7)}/${m.d.slice(0, 4)} ${m.h} ${m.autor}: ${m.texto.length > 700 ? m.texto.slice(0, 700) + '…' : m.texto}`;
  const linhas = c.msgs.map(fmt);
  const total = linhas.reduce((a, l) => a + l.length + 1, 0);
  if (total <= max) return linhas.join('\n');
  const ini = [];
  let usado = 0;
  for (const l of linhas) {
    if (usado + l.length > max * 0.2) break;
    ini.push(l);
    usado += l.length + 1;
  }
  const fim = [];
  for (let i = linhas.length - 1; i >= ini.length; i--) {
    if (usado + linhas[i].length > max) break;
    fim.unshift(linhas[i]);
    usado += linhas[i].length + 1;
  }
  return [...ini, `[… ${linhas.length - ini.length - fim.length} mensagens do meio omitidas …]`, ...fim].join('\n');
}

function normalizarLeitura(r) {

    ehLead: o.ehLead !== false,
    empresa: s(o.empresa, 120),
    contato: s(o.contato, 80),
    cargo: s(o.cargo, 60),
    telefone: s(o.telefone, 30),
    email: s(o.email, 120),
    cidade: s(o.cidade, 80),
    segmento: s(o.segmento, 80),
    site: s(o.site, 120),
    servicos: Array.isArray(o.servicos) ? uniq(o.servicos.map(String).filter((k) => SERVICO[k])) : [],
    valor: valor > 0 && valor < 1e8 ? round2(valor) : null,
    origem: cfg().origens.includes(o.origem) ? o.origem : '',
    etapa: ETAPA[o.etapa] ? o.etapa : 'contato',
    motivoPerda: cfg().motivosPerda.includes(o.motivoPerda) ? o.motivoPerda : '',
    proximoContato: prox,
    proximaAcao: s(o.proximaAcao, 80),
    resumo: s(o.resumo, 900),
    marcos: Array.isArray(o.marcos) ? o.marcos.filter((m) => m && dataOk(m.data) && s(m.texto)).slice(0, 8).map((m) => ({ data: dataOk(m.data), texto: s(m.texto, 240) })) : [],
  };
}

    contato: d.contato || c.clienteNome || '',
    cargo: d.cargo || '',
    telefone: d.telefone || c.telefone || '',
    email: d.email || '',
    cidade: '',
    segmento: '',
    site: d.site || '',
    servicos: d.servicos || [],

const tel8 = (t) => { const d = digits(t); return d.length >= 8 ? d.slice(-8) : ''; };
function acharLeadConversa(info, c) {
  const leads = Store.all('leads').sort((a, b) => (ABERTAS.includes(b.etapa) ? 1 : 0) - (ABERTAS.includes(a.etapa) ? 1 : 0));
  let l = leads.find((x) => x.conversaHash && x.conversaHash === c.hash);
  if (l) return l;
  const t = tel8(info.telefone || c.telefone);
  if (t) { l = leads.find((x) => tel8(x.telefone) === t); if (l) return l; }
  const ne = norm(info.empresa).trim();
  if (ne) { l = leads.find((x) => norm(x.empresa).trim() === ne); if (l) return l; }
  const nc = norm(info.contato || c.clienteNome).trim();

  return null;
}
function acharClienteConversa(info, c) {

async function carregarConversas(files) {
  const st = Conv.st;
  if (!st || st.fase !== 'escolher') return;
  const lista = [];
  for (const f of files.slice(0, 30)) {
    try {
      if (/\.zip$/i.test(f.name) || /zip/.test(f.type)) {
        const txts = await lerZipTextos(await f.arrayBuffer());
        if (!txts.length) lista.push({ arquivo: f.name, erro: 'O .zip não tem uma conversa em texto.' });
        txts.slice(0, 1).forEach((t) => lista.push({ arquivo: f.name, texto: t.texto }));
      } else lista.push({ arquivo: f.name, texto: await lerArquivoTexto(f) });
    } catch {
      lista.push({ arquivo: f.name, erro: 'Não consegui abrir este arquivo.' });
    }
  }
  if (Conv.st !== st) return;
  st.itens = lista.map((x, k) => {
    const c = x.erro ? null : lerConversa(x.texto, x.arquivo);
    return { k, arquivo: x.arquivo, c, status: c ? 'fila' : 'erro', erro: x.erro || (c ? '' : 'Não parece uma conversa exportada do WhatsApp.') };
  });
  if (files.length > 30) toast('Até 30 conversas por vez. As primeiras 30 foram carregadas.');
  st.fase = 'lendo';
  pintarConversas();
  await lerConversas(st);
}
async function lerConversas(st) {
  let sample = null;
  try { sample = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch { sample = null; }
  if (!sample) st.semClaude = 'indisponivel';
  const fila = st.itens.filter((x) => x.status === 'fila');
  const worker = async () => {
    while (fila.length && Conv.st === st && !st.parado) {
      const it = fila.shift();
      it.status = 'lendo';
      pintarConversas();
      if (!st.semClaude) {
        const ctl = new AbortController();
        st.ctls.add(ctl);
        try {
          it.info = normalizarLeitura(await sample.json(promptConversa(it.c), { signal: ctl.signal }));
        } catch (e) {
          const code = e && e.code;
          if (code === 'cancelled') { it.status = 'parado'; continue; }
          if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].includes(code)) st.semClaude = code === 'not_granted' ? 'negado' : 'indisponivel';
          else if (code === 'rate_limited') st.semClaude = 'limite';
          else it.avisoLeitura = 'O Claude não conseguiu ler esta conversa; preenchi o básico.';
        } finally {
          st.ctls.delete(ctl);
        }
      }
      if (!it.info) it.info = leituraLocal(it.c);
      it.status = 'pronto';
      pintarConversas();
    }
  };
  await Promise.all([worker(), worker()]);
  if (Conv.st !== st) return;
  st.itens.forEach((x) => { if (x.status === 'fila' || x.status === 'lendo') x.status = 'parado'; });
  prepararRevisao(st);
  st.fase = 'conferir';
  pintarConversas();
}

function prepararRevisao(st) {

  pintaPe();
}
async function salvarConversas(root, itens) {
  const plano = [];
  for (const it of itens) {
    const acao = $(`[data-cv-acao="${it.k}"]`, root).value;
    if (acao === 'ignorar') continue;
    const v = readForm(root, it.fid, it.fields);
    if (!validateForm(root, it.fid, it.fields, v)) {
      fieldEl(root, it.fid, 'empresa').closest('.cv-card').scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
      return;
    }
    plano.push({ it, acao, v });
  }
  let criados = 0;
  let atualizados = 0;
  for (const { it, acao, v } of plano) {
    try {
      if (acao.startsWith('atualizar:') && Store.get('leads', acao.slice(10))) {
        await atualizarLeadConversa(acao.slice(10), it, v);
        atualizados++;
      } else {
        await criarLeadConversa(it, v);
        criados++;
      }
    } catch {
      break;
    }
  }
  const n = criados + atualizados;
  if (!n) return;
  Store.logAuto({ tipo: 'conversas', txt: `Leu ${plural(plano.length, 'conversa', 'conversas')} do WhatsApp: ${[criados ? plural(criados, 'lead novo', 'leads novos') : '', atualizados ? plural(atualizados, 'lead atualizado', 'leads atualizados') : ''].filter(Boolean).join(' e ')}`, ref: '' });
  Drawer.close();
  toast(`${[criados ? plural(criados, 'lead criado', 'leads criados') : '', atualizados ? plural(atualizados, 'lead atualizado', 'leads atualizados') : ''].filter(Boolean).join(' e ')} a partir das conversas.`, { action: 'Ver funil', ms: 6000, onAction: () => go('funil') });
}
async function criarLeadConversa(it, v) {
  const { info, c } = it;
  const t = nowISO();
  const aberto = ABERTAS.includes(v.etapa);
  const origem = info.origem || (cfg().origens.includes('WhatsApp') ? 'WhatsApp' : '');
  const hist = [{ tipo: 'criado', texto: 'Lead criado a partir da conversa do WhatsApp', data: t, autor: S.me }, ...marcosHist(info.marcos)];
  if (info.resumo) hist.push({ tipo: 'nota', texto: `Resumo da conversa: ${info.resumo}`, data: t, autor: S.me });
  if (v.etapa === 'perdido') hist.push({ tipo: 'perdido', texto: `Perdido: ${v.motivoPerda}`, data: t, autor: S.me });
  await Store.put('leads', newId('ld'), {
    empresa: v.empresa,
    contato: v.contato || '',
    cargo: info.cargo || '',
    telefone: v.telefone || '',
    email: info.email || '',
    segmento: info.segmento || '',
    cidade: info.cidade || '',
    site: info.site || '',
    servicos: v.servicos || [],
    valor: v.valor || null,
    origem,
    etapa: v.etapa,
    responsavel: v.responsavel,
    proximoContato: aberto ? v.proximoContato || '' : '',
    proximaAcao: aberto ? v.proximaAcao || '' : '',
    notas: info.resumo ? `Resumo da conversa do WhatsApp: ${info.resumo}` : '',
    ...(v.etapa === 'perdido' ? { motivoPerda: v.motivoPerda, perdidoEm: c.ultima } : {}),
    criadoEm: isoDia(c.primeira),
    atualizadoEm: t,
    etapaDesde: c.ultima,
    criadoPor: S.me,
    historico: hist,
    importadoDe: 'whatsapp',
    conversaHash: c.hash,
    conversaAte: c.ultima,
  });
}
async function atualizarLeadConversa(id, it, v) {
  const l = Store.get('leads', id);
  const { info, c } = it;
  const t = nowISO();
  const ch = { atualizadoEm: t, conversaHash: c.hash, conversaAte: c.ultima, responsavel: v.responsavel };
  for (const k of ['empresa', 'contato', 'telefone']) if (v[k] && v[k] !== l[k]) ch[k] = v[k];
  for (const k of ['cargo', 'email', 'segmento', 'cidade', 'site']) if (!l[k] && info[k]) ch[k] = info[k];
  if (!l.origem && info.origem) ch.origem = info.origem;
  if (v.valor && v.valor !== l.valor) ch.valor = v.valor;
  if (JSON.stringify(v.servicos || []) !== JSON.stringify(l.servicos || [])) ch.servicos = v.servicos || [];
  if (ABERTAS.includes(v.etapa)) {
    ch.proximoContato = v.proximoContato || '';
    ch.proximaAcao = v.proximaAcao || '';
  }
  const ja = l.historico || [];
  const novos = marcosHist(info.marcos).filter((h) => !ja.some((x) => x.texto === h.texto && String(x.data).slice(0, 10) === h.data.slice(0, 10)));
  const hist = [...ja, ...novos];
  if (info.resumo) hist.push({ tipo: 'nota', texto: `Resumo da conversa do WhatsApp: ${info.resumo}`, data: t, autor: S.me });
  if (v.etapa !== l.etapa) {
    ch.etapa = v.etapa;
    ch.etapaDesde = today();
    if (v.etapa === 'perdido') {
      ch.motivoPerda = v.motivoPerda;
      ch.perdidoEm = today();
      hist.push({ tipo: 'perdido', texto: `Perdido: ${v.motivoPerda} (pela conversa do WhatsApp)`, data: t, autor: S.me });
    } else hist.push({ tipo: 'etapa', texto: `${ETAPA[l.etapa] ? ETAPA[l.etapa].l : l.etapa} → ${ETAPA[v.etapa].l} (pela conversa do WhatsApp)`, data: t, autor: S.me });
  }
  if (!l.notas && info.resumo) ch.notas = `Resumo da conversa do WhatsApp: ${info.resumo}`;
  ch.historico = hist;
  await Store.patch('leads', id, ch);
}

/* ── conta e acesso dos sócios (só na versão hospedada na Vercel, com login) ── */
const Host = window.PrismaHost && window.PrismaHost.tipo === 'vercel' ? window.PrismaHost : null;

const Conta = {
  membros: null,
  caixa: null,
  lidoEm: 0,
  lendo: null,
  async lerMembros(forcar) {
    if (!Host) return [];
    if (!forcar && this.membros && Date.now() - this.lidoEm < 30000) return this.membros;
    if (this.lendo) return this.lendo;
    this.lendo = (async () => {
      try {
        this.membros = await Host.membros();
        this.lidoEm = Date.now();
      } catch (e) {
        console.warn('sócios', e);
        if (!this.membros) this.membros = [];
      }
      this.lendo = null;
      return this.membros;
    })();
    return this.lendo;
  },
  ativo(socio) {
    if (!Host) return false;
    if (!this.membros) this.lerMembros().then(() => Store.emit());
    return !!(this.membros || []).find((m) => m.socio === socio && m.ativo);
  },
  dataCurta(iso) {
    return iso ? fmtDateShort(toISODate(new Date(iso))) : '';
  },
  endereco() {
    return Host.endereco.replace(/^https?:\/\//, '').replace(/\/$/, '');
  },

  renderMe(box) {
