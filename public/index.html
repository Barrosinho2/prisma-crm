const IMPOSTO_MODOS = ['off', 'simples', 'mei'];
const COLS = ['leads', 'clientes', 'projetos', 'lancamentos', 'recorrencias', 'tarefas'];
const PREFIX = { leads: 'ld', clientes: 'cl', projetos: 'pj', lancamentos: 'lc', recorrencias: 'rc', tarefas: 'tf' };

/* ───────────────────────── store ─────────────────────────
   Nuvem: capability `db` do artifact (tempo real, compartilhado entre os sócios).
   Local: só em memória — usado quando o banco não está disponível (nada é salvo). */
const Store = (() => {
  const st = {
    mode: 'loading', // 'cloud' | 'local'
    db: null,
    user: null,
    uid: null,
    canWrite: null,
    readOnly: false,
    me: null,
    prefsLoaded: false,
    config: clone(DEFAULT_CONFIG),
    loaded: new Set(),
    ready: false,
    timedOut: false,
    fatal: null,
    version: 0,
    autoLog: [],
    autoEstado: { feitos: {} },
  };
  COLS.forEach((c) => (st[c] = new Map()));
  const listeners = new Set();
  let scheduled = false;
  let loadTimer = null;

  function emit() {
    st.version++;
    if (scheduled) return;
    scheduled = true;
    const run = () => {
      scheduled = false;
      listeners.forEach((fn) => {
        try { fn(); } catch (e) { console.error(e); }
      });
    };
    if (document.hidden) setTimeout(run, 30);
    else requestAnimationFrame(run);
  }
  function subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  /* junta o que está no banco com os padrões, campo a campo: chaves novas ganham o padrão, tipos errados são descartados */
  function deepMerge(def, raw) {
    if (Array.isArray(def)) return Array.isArray(raw) && raw.length ? raw.map(String) : clone(def);
    if (def && typeof def === 'object') {
      const src = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
      const out = {};
      for (const k of Object.keys(def)) out[k] = deepMerge(def[k], src[k]);
      return out;
    }
    if (raw === undefined || raw === null) return def;
    if (typeof def === 'number') {
      const n = +raw;
      return isFinite(n) ? n : def;
    }
    if (typeof def === 'boolean') return !!raw;
    return String(raw);
  }
  function mergeConfig(raw) {
    const c = deepMerge(DEFAULT_CONFIG, raw && typeof raw === 'object' ? raw : null);
    for (const s of SOCIOS) if (!c.socios[s].nome.trim()) c.socios[s].nome = DEFAULT_CONFIG.socios[s].nome;
    // uma lista de tarefas pode ficar vazia de propósito (serviço sem checklist)
    const rc = raw && raw.auto && raw.auto.checklist;
    if (rc && typeof rc === 'object') for (const s of Object.keys(c.auto.checklist)) if (Array.isArray(rc[s])) c.auto.checklist[s] = rc[s].map(String);
    if (!IMPOSTO_MODOS.includes(c.auto.imposto)) c.auto.imposto = 'off';
    if (!SOCIOS.includes(c.auto.nfResponsavel)) c.auto.nfResponsavel = 'rafael';
    for (const k of Object.keys(c.auto.prazosEtapa)) c.auto.prazosEtapa[k] = Math.max(0, Math.min(60, Math.round(c.auto.prazosEtapa[k])));
    c.auto.diasParado = Math.max(3, Math.min(90, Math.round(c.auto.diasParado)));
    c.auto.diasCobranca = Math.max(1, Math.min(15, Math.round(c.auto.diasCobranca)));
    c.auto.impostoDia = Math.max(1, Math.min(28, Math.round(c.auto.impostoDia)));
    for (const s of Object.keys(c.auto.checklist)) c.auto.checklist[s] = c.auto.checklist[s].map((x) => x.trim()).filter(Boolean);
    return c;
  }

  const ALL_KEYS = () => [...COLS, 'config'];
  function markLoaded(key) {
    st.loaded.add(key);
    if (!st.ready && ALL_KEYS().every((k) => st.loaded.has(k))) {
      st.ready = true;
      st.timedOut = false;
      clearTimeout(loadTimer);
    }
  }

  async function waitForClaude() {
    for (let i = 0; i < 15; i++) {
      if (window.claude && typeof window.claude.use === 'function') return window.claude;
      await sleep(100);
    }
    return null;
  }

  async function init() {
    const claude = await waitForClaude();
    let db = null;
    let user = null;
    if (claude) {
      try {
        [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      } catch (e) {
        console.warn('capabilities indisponíveis', e);
      }
    }
    st.user = user;
    if (!db) return startLocal(!!claude);
    st.db = db;
    st.mode = 'cloud';
    try { st.uid = user ? await user.id() : null; } catch { st.uid = null; }
    try {
      const cw = user ? await user.can('data.write') : null;
      st.canWrite = cw;
      if (cw === false) st.readOnly = true;
    } catch { st.canWrite = null; }

    loadTimer = setTimeout(() => {
      if (!st.ready) { st.timedOut = true; emit(); }
    }, 10000);

    for (const c of COLS) {
      db.collection(c).onSnapshot(
        (snap) => {
          const m = new Map();
          snap.docs.forEach((d) => {
            if (d.exists) m.set(d.id, Object.assign({}, d.data(), { id: d.id }));
          });
          st[c] = m;
          if (!snap.metadata.fromCache) markLoaded(c);
          emit();
        },
        (err) => subError(c, err)
      );
    }
    db.doc('config/geral').onSnapshot(
      (s) => {
        st.config = mergeConfig(s.exists ? s.data() : null);
        if (!s.metadata.fromCache) markLoaded('config');
        emit();
      },
      (err) => subError('config', err)
    );
    db.doc('automacoes/log').onSnapshot(
      (s) => {
        const d = s.exists ? s.data() : null;
        logServidor = d && Array.isArray(d.itens) ? d.itens.filter((x) => x && typeof x === 'object') : [];
        st.autoLog = juntaLog();
        emit();
      },
      (err) => console.warn('histórico do piloto indisponível', err)
    );
    if (st.uid) {
      db.doc(`data/users/${st.uid}/prefs`).onSnapshot(
        (s) => {
          const p = s.exists ? s.data() : {};
          st.me = SOCIOS.includes(p.socio) ? p.socio : st.me || localMe();
          st.prefsLoaded = true;
          emit();
        },
        () => { st.me = localMe(); st.prefsLoaded = true; emit(); }
      );
    } else {
      st.me = localMe();
      st.prefsLoaded = true;
    }
    emit();
  }

  function subError(key, err) {
    console.warn('assinatura encerrada', key, err);
    if (err && err.code === 'revoked') {
      st.readOnly = true;
      st.fatal = 'revoked';
    } else if (err && err.code === 'unavailable') {
      st.fatal = 'unavailable';
    }
    markLoaded(key);
    emit();
  }

  function startLocal(hadClaude) {
    st.mode = 'local';
    st.localReason = hadClaude ? 'nodb' : 'file';
    const seed = window.__PRISMA_SEED__;
    if (seed && typeof seed === 'object') {
      for (const c of COLS) {
        (seed[c] || []).forEach((r) => st[c].set(r.id, clone(r)));
      }
      if (seed.config) st.config = mergeConfig(seed.config);
    }
    st.me = localMe();
    st.prefsLoaded = true;
    ALL_KEYS().forEach(markLoaded);
    emit();
  }

  function localMe() {
    try {
      const v = localStorage.getItem('prisma-crm-me');
      return SOCIOS.includes(v) ? v : null;
    } catch { return null; }
  }

  /* ── fila de escrita: uma por documento ── */
  const queue = new Map();
  function enqueue(path, fn) {
    const prev = queue.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    queue.set(path, next);
    next.finally(() => { if (queue.get(path) === next) queue.delete(path); }).catch(() => {});
    return next;
  }
  function pendingWrites() { return queue.size; }

  function cleanData(o) {
    const out = JSON.parse(JSON.stringify(o, (k, v) => (typeof v === 'number' && !isFinite(v) ? 0 : v)));
    delete out.id;
    return out;
  }

  let lastErrToast = 0;
  function writeError(e, op = 'set') {
    const code = e && e.code;
    console.warn('falha ao gravar', e);
    const now = Date.now();
    const quiet = now - lastErrToast < 2500;
    lastErrToast = now;
    // update num documento que não existe mais (o outro sócio apagou) também volta invalid_argument
    if (code === 'invalid_argument' && op === 'update') {
      if (!quiet) toast('Esse registro foi apagado ou mudou enquanto você editava. Confira e tente de novo.', { type: 'error' });
      return;
    }
    if (code === 'invalid_argument' && st.canWrite !== true) {
      st.readOnly = true;
      emit();
      if (!quiet) toast('Sem permissão para alterar os dados. Peça ao dono do CRM acesso de Editor.', { type: 'error' });
      return;
    }
    if (quiet) return;
    if (code === 'quota_exceeded') toast('O banco do CRM chegou ao limite de registros. Exporte um backup em Ajustes e apague registros antigos.', { type: 'error', ms: 8000 });
    else if (code === 'resource_exhausted') toast('Muitas alterações em sequência. Espere alguns segundos e tente de novo.', { type: 'error' });
    else if (code === 'revoked') { st.readOnly = true; emit(); toast('Seu acesso a este CRM mudou. Recarregue a página.', { type: 'error' }); }
    else toast('Não foi possível salvar. Verifique a conexão e tente de novo.', { type: 'error' });
  }

  async function guarded(path, fn, op = 'set') {
    if (st.readOnly) {
      toast('Você tem acesso somente de leitura.', { type: 'error' });
      throw new Error('readonly');
    }
    return enqueue(path, async () => {
      try {
        await fn();
      } catch (e) {
        if (e && e.code === 'unavailable') {
          await sleep(300 + Math.random() * 600);
          try { await fn(); return; } catch (e2) { writeError(e2, op); throw e2; }
        }
        writeError(e, op);
        throw e;
      }
    });
  }

  /* cria ou substitui o documento inteiro */
  function put(col, id, data) {
    const body = cleanData(data);
    if (st.mode === 'local') {
      if (st.readOnly) return Promise.reject(new Error('readonly'));
      st[col].set(id, Object.assign({}, body, { id }));
      emit();
      return Promise.resolve();
    }
    return guarded(`${col}/${id}`, () => st.db.collection(col).doc(id).set(body));
  }
  /* mescla campos num documento existente */
  function patch(col, id, partial) {
    const body = cleanData(partial);
    if (st.mode === 'local') {
      const cur = st[col].get(id);
      if (!cur) return Promise.resolve();
      st[col].set(id, Object.assign({}, cur, body, { id }));
      emit();
      return Promise.resolve();
    }
    return guarded(`${col}/${id}`, () => st.db.collection(col).doc(id).update(body), 'update');
  }
  function remove(col, id) {
    if (st.mode === 'local') {
      st[col].delete(id);
      emit();
      return Promise.resolve();
    }
    return guarded(`${col}/${id}`, () => st.db.collection(col).doc(id).delete(), 'delete');
  }
  function saveConfig(cfg) {
    const body = cleanData(cfg);
    if (st.mode === 'local') {
      st.config = mergeConfig(body);
      emit();
      return Promise.resolve();
    }
    return guarded('config/geral', () => st.db.doc('config/geral').set(body));
  }
  async function setMe(socio) {
    st.me = socio;
    try { localStorage.setItem('prisma-crm-me', socio); } catch {}
    emit();
    if (st.mode === 'cloud' && st.uid) {
      try {
        await enqueue(`data/users/${st.uid}/prefs`, () => st.db.doc(`data/users/${st.uid}/prefs`).set({ socio, atualizadoEm: nowISO() }));
      } catch (e) {
        console.warn('preferência não salva no banco', e);
      }
    }
  }

  /* operações em lote (importar, apagar exemplos): uma por vez, com espera quando o banco pede calma */
  async function bulk(items, onProgress) {
    if (st.readOnly) throw Object.assign(new Error('readonly'), { code: 'readonly' });
    let done = 0;
    for (const it of items) {
      if (st.mode === 'local') {
        if (it.op === 'remove') st[it.col].delete(it.id);
        else if (it.op === 'config') st.config = mergeConfig(it.data);
        else st[it.col].set(it.id, Object.assign({}, cleanData(it.data), { id: it.id }));
      } else {
        let attempt = 0;
        for (;;) {
          try {
            if (it.op === 'remove') await st.db.collection(it.col).doc(it.id).delete();
            else if (it.op === 'config') await st.db.doc('config/geral').set(cleanData(it.data));
            else await st.db.collection(it.col).doc(it.id).set(cleanData(it.data));
            break;
          } catch (e) {
            attempt++;
            const code = e && e.code;
            if ((code === 'resource_exhausted' || code === 'unavailable') && attempt < 5) {
              await sleep(1500 * attempt);
              continue;
            }
            throw e;
          }
        }
        await sleep(60);
      }
      done++;
      if (onProgress) onProgress(done, items.length);
    }
    emit();
    return done;
  }

  /* ── piloto automático: histórico, trava e estado ── */
  const LOG_MAX = 40;
  const TAB = newId('tab');
  let logServidor = [];
  const logPendente = [];
  function juntaLog() {
    const vistos = new Set();
    return [...logPendente, ...logServidor]
      .filter((x) => { const k = x.id || x.em + x.txt; if (vistos.has(k)) return false; vistos.add(k); return true; })
      .sort((a, b) => String(b.em).localeCompare(String(a.em)))
      .slice(0, LOG_MAX);
  }
  function logAuto(item) {
    const it = Object.assign({ id: newId('lg'), em: nowISO(), por: st.me || null }, item);
    logPendente.push(it);
    st.autoLog = juntaLog();
    emit();
    if (st.mode !== 'cloud' || st.readOnly) return Promise.resolve();
    return enqueue('automacoes/log', async () => {
      const itens = juntaLog();
      try {
        await st.db.doc('automacoes/log').set({ itens, atualizadoEm: nowISO() });
        logServidor = itens;
        logPendente.splice(0, logPendente.length);
      } catch (e) {
        console.warn('histórico do piloto não salvo', e);
      }
    });
  }
  /* só uma aba por vez roda as automações de calendário (as duas acabariam fazendo a mesma coisa) */
  async function trava(ms = 30000) {
    if (st.mode !== 'cloud') return true;
    const ref = st.db.doc('automacoes/trava');
    if (typeof ref.acquire !== 'function') return true;
    try {
      const r = await ref.acquire({ holder: TAB, ttlMs: ms });
      return !!(r && r.acquired);
    } catch (e) {
      const code = e && e.code;
      if (code === 'capability_removed' || code === 'capability_disabled') return true;
      console.warn('trava do piloto', e);
      return false;
    }
  }
  async function lerEstado() {
    if (st.mode !== 'cloud') return clone(st.autoEstado);
    const s = await st.db.doc('automacoes/estado').get();
    const d = s.exists ? s.data() : {};
    st.autoEstado = Object.assign({ feitos: {} }, clone(d || {}));
    if (!st.autoEstado.feitos || typeof st.autoEstado.feitos !== 'object') st.autoEstado.feitos = {};
    return clone(st.autoEstado);
  }
  async function gravarEstado(est) {
    st.autoEstado = clone(est);
    if (st.mode !== 'cloud') return;
    await enqueue('automacoes/estado', () => st.db.doc('automacoes/estado').set(cleanData(est)));
  }

  function all(col) { return Array.from(st[col].values()); }
  function get(col, id) { return id ? st[col].get(id) || null : null; }
  function totalDocs() { return COLS.reduce((a, c) => a + st[c].size, 0); }
  function hasDemo() { return COLS.some((c) => all(c).some((r) => r.demo)); }

  return { st, init, subscribe, emit, put, patch, remove, saveConfig, setMe, bulk, all, get, totalDocs, hasDemo, pendingWrites, mergeConfig, writeError, logAuto, trava, lerEstado, gravarEstado };
})();

const S = Store.st;
const cfg = () => S.config;
const socioNome = (k) => (k && S.config.socios[k] ? S.config.socios[k].nome : '—');
const meNome = () => socioNome(S.me);

/* ── 03-calc.js ── */
/* ───────────────────────── cálculos derivados ───────────────────────── */
const Calc = {
  /* status de um lançamento: pago | atrasado | pendente */
  lancStatus(l, t = today()) {
    if (l.pagoEm) return 'pago';
    if (l.vencimento && l.vencimento < t) return 'atrasado';
    return 'pendente';
  },
  /* o saldo considera lançamentos pagos a partir da data do saldo inicial */
  saldoAtual(t = today()) {
    const c = cfg();
    const from = c.saldoInicialData || '';
    let s = +c.saldoInicial || 0;
    for (const l of Store.all('lancamentos')) {
      if (!l.pagoEm || l.pagoEm > t) continue;
      if (from && l.pagoEm < from) continue;
      s += l.tipo === 'entrada' ? +l.valor || 0 : -(+l.valor || 0);
    }
    return round2(s);
  },
  mes(m) {
    const out = { recebido: 0, pago: 0, previstoEntrada: 0, previstoSaida: 0, abertoEntrada: 0, abertoSaida: 0 };
    for (const l of Store.all('lancamentos')) {
      const v = +l.valor || 0;
      if (l.pagoEm && monthOf(l.pagoEm) === m) {
        if (l.tipo === 'entrada') out.recebido += v;
        else out.pago += v;
      }
      if (monthOf(l.vencimento) === m) {
        if (l.tipo === 'entrada') {
          out.previstoEntrada += v;
          if (!l.pagoEm) out.abertoEntrada += v;
        } else {
          out.previstoSaida += v;
          if (!l.pagoEm) out.abertoSaida += v;
        }
      }
    }
    out.resultado = out.recebido - out.pago;
    return out;
  },
  emAberto(tipo, t = today()) {
    const list = Store.all('lancamentos').filter((l) => l.tipo === tipo && !l.pagoEm);
    const atrasados = list.filter((l) => l.vencimento && l.vencimento < t);
    return { list, total: sum(list, (l) => l.valor), atrasados, totalAtrasado: sum(atrasados, (l) => l.valor) };
  },
  leadsAbertos() {
    return Store.all('leads').filter((l) => ABERTAS.includes(l.etapa));
  },
  pipeline() {
    const ab = Calc.leadsAbertos();
    return {
      n: ab.length,
      total: sum(ab, (l) => l.valor),
      ponderado: sum(ab, (l) => (+l.valor || 0) * (ETAPA[l.etapa] ? ETAPA[l.etapa].p : 0)),
    };
  },
  conversao() {
    const leads = Store.all('leads');
    const g = leads.filter((l) => l.etapa === 'ganho').length;
    const p = leads.filter((l) => l.etapa === 'perdido').length;
    return { ganhos: g, perdidos: p, taxa: g + p ? g / (g + p) : null };
  },
  vendasMes(m) {
    const ps = Store.all('projetos').filter((p) => monthOf(p.dataFechamento) === m && p.status !== 'cancelado');
    return { n: ps.length, total: sum(ps, (p) => p.valor) };
  },
  leadsNovosMes(m) {
    return Store.all('leads').filter((l) => monthOf(l.criadoEm) === m).length;
  },
  mrr() {
    let entrada = 0;
    let saida = 0;
    for (const r of Store.all('recorrencias')) {
      if (!r.ativo) continue;
      const v = r.frequencia === 'anual' ? (+r.valor || 0) / 12 : +r.valor || 0;
      if (r.tipo === 'entrada') entrada += v;
      else saida += v;
    }
    return { entrada, saida };
  },
  /* recorrências */
  recAplica(r, m) {
    if (!r.ativo) return false;
    if (r.inicio && m < r.inicio) return false;
    if (r.fim && m > r.fim) return false;
    if (r.frequencia === 'anual') return +m.slice(5, 7) === +r.mesAnual;
    return true;
  },
  recLancId(recId, m) {
    return `rec_${recId}_${m}`;
  },
  recLancada(r, m) {
    if (Store.get('lancamentos', Calc.recLancId(r.id, m))) return true;
    return Store.all('lancamentos').some((l) => l.recorrenciaId === r.id && l.competencia === m);
  },
  /* mês pulado: alguém excluiu o lançamento daquele mês de propósito */
  recPulada(r, m) {
    return Array.isArray(r.pulados) && r.pulados.includes(m);
  },
  recFeita(r, m) {
    return Calc.recLancada(r, m) || Calc.recPulada(r, m);
  },
  recPendentes(m) {
    return Store.all('recorrencias').filter((r) => Calc.recAplica(r, m) && !Calc.recFeita(r, m));
  },
  /* projeto */
  projetoFin(p) {
    const ls = Store.all('lancamentos').filter((l) => l.projetoId === p.id && l.tipo === 'entrada' && !l.recorrenciaId);
    const recebido = sum(ls.filter((l) => l.pagoEm), (l) => l.valor);
    const pendente = sum(ls.filter((l) => !l.pagoEm), (l) => l.valor);
    const base = +p.valor || 0;
    return { ls, recebido, pendente, semParcela: Math.max(0, round2(base - recebido - pendente)), pct: base ? Math.min(1, recebido / base) : 0 };
  },
  clienteFin(c) {
    const ls = Store.all('lancamentos').filter((l) => l.clienteId === c.id && l.tipo === 'entrada');
    const recs = Store.all('recorrencias').filter((r) => r.clienteId === c.id && r.ativo && r.tipo === 'entrada');
    return {
      recebido: sum(ls.filter((l) => l.pagoEm), (l) => l.valor),
      aberto: sum(ls.filter((l) => !l.pagoEm), (l) => l.valor),
      mrr: sum(recs, (r) => (r.frequencia === 'anual' ? r.valor / 12 : r.valor)),
      projetos: Store.all('projetos').filter((p) => p.clienteId === c.id),
    };
  },
  /* follow-ups e tarefas */
  followups(t = today()) {
    return Calc.leadsAbertos().filter((l) => l.proximoContato).map((l) => ({ lead: l, data: l.proximoContato, atrasado: l.proximoContato < t }));
  },
  tarefasAbertas() {
    return Store.all('tarefas').filter((x) => !x.feita);
  },
  diasNaEtapa(l) {
    const ref = l.etapaDesde || (l.criadoEm ? String(l.criadoEm).slice(0, 10) : '');
    return ref ? Math.max(0, daysBetween(String(ref).slice(0, 10), today())) : 0;
  },
  /* lead aberto, sem próximo contato marcado, há dias na mesma etapa e sem ninguém mexer */
  leadParado(l, dias = cfg().auto.diasParado, t = today()) {
    if (!ABERTAS.includes(l.etapa) || l.proximoContato) return false;
    const d = Calc.diasNaEtapa(l);
    const mexido = l.atualizadoEm ? daysBetween(String(l.atualizadoEm).slice(0, 10), t) : d;
    return d >= dias && mexido >= Math.min(7, dias);
  },
  /* fluxo mensal para gráficos */
  fluxo(mFim, n = 6) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const m = monthAdd(mFim, -i);
      const x = Calc.mes(m);
      out.push({ m, entradas: x.recebido, saidas: x.pago, resultado: x.resultado });
    }
    return out;
  },
  /* projeção do saldo para os próximos `dias` */
  projecao(dias = 90) {
    const t = today();
    const fim = addDays(t, dias);
    const ev = new Map();
    const add = (d, v, item) => {
      const k = d < t ? t : d;
      if (k > fim) return;
      if (!ev.has(k)) ev.set(k, { v: 0, itens: [] });
      const e = ev.get(k);
      e.v += v;
      e.itens.push(item);
    };
    let atrasadosEntrada = 0;
    let atrasadosSaida = 0;
    for (const l of Store.all('lancamentos')) {
      if (l.pagoEm || !l.vencimento) continue;
      const v = (l.tipo === 'entrada' ? 1 : -1) * (+l.valor || 0);
      if (l.vencimento < t) { if (l.tipo === 'entrada') atrasadosEntrada += +l.valor || 0; else atrasadosSaida += +l.valor || 0; }
      add(l.vencimento, v, { desc: l.descricao, v, tipo: l.tipo });
    }
    // recorrências ainda não lançadas dentro do horizonte
    let m = monthOf(t);
    const mFim = monthOf(fim);
    while (m <= mFim) {
      for (const r of Store.all('recorrencias')) {
        if (!Calc.recAplica(r, m) || Calc.recFeita(r, m)) continue;
        const d = dateInMonth(m, r.dia);
        if (d < t) continue;
        add(d, (r.tipo === 'entrada' ? 1 : -1) * (+r.valor || 0), { desc: r.descricao + ' (recorrente)', v: (r.tipo === 'entrada' ? 1 : -1) * r.valor, tipo: r.tipo, prev: true });
      }
      m = monthAdd(m, 1);
    }
    let saldo = Calc.saldoAtual(t);
    const pts = [];
    for (let i = 0; i <= dias; i++) {
      const d = addDays(t, i);
      const e = ev.get(d);
      if (e) saldo += e.v;
      pts.push({ d, v: round2(saldo), itens: e ? e.itens : [] });
    }
    return { pts, atrasadosEntrada, atrasadosSaida };
  },
};

/* itens que pedem atenção (painel e agenda) */
function itensAtencao() {
  const t = today();
  const A = cfg().auto;
  const items = [];
  for (const f of Calc.followups(t)) {
    const wa = waMsgLink(f.lead.telefone, msgLead(f.lead));
    const link = wa ? { href: wa, label: 'WhatsApp', ic: 'whatsapp' } : null;
    if (f.data < t) items.push({ sev: 3, ic: 'clock', tone: 'bad', txt: `Follow-up atrasado com ${f.lead.empresa}`, meta: `${relDay(f.data)}${f.lead.proximaAcao ? ' · ' + f.lead.proximaAcao : ''}`, open: () => showLead(f.lead.id), dono: f.lead.responsavel, link });
    else if (f.data === t) items.push({ sev: 2, ic: 'clock', tone: 'warn', txt: `Falar hoje com ${f.lead.empresa}`, meta: f.lead.proximaAcao || 'Follow-up', open: () => showLead(f.lead.id), dono: f.lead.responsavel, link });
  }
  const linkCobranca = (l, tipoMsg, marcar) => {
    const c = Store.get('clientes', l.clienteId);
    const texto = msgCobranca(l, tipoMsg);
    const wa = c ? waMsgLink(c.telefone, texto) : '';
    const onClick = marcar ? () => Store.patch('lancamentos', l.id, { lembreteEm: today() }).catch(() => {}) : null;
    if (wa) return { href: wa, label: tipoMsg === 'atraso' ? 'Cobrar' : 'Lembrar', ic: 'whatsapp', onClick };
    return { label: 'Copiar mensagem', ic: 'copy', fn: () => { copyText(texto, 'Mensagem copiada. Cole no WhatsApp ou no e-mail do cliente.'); if (onClick) onClick(); } };
  };
  const rec = Calc.emAberto('entrada', t);
  for (const l of rec.atrasados) items.push({ sev: 3, ic: 'coin', tone: 'bad', txt: `Recebimento atrasado: ${l.descricao}`, meta: `${money(l.valor)} · venceu ${relDay(l.vencimento)}${l.clienteId ? ' · ' + clienteNome(l.clienteId) : ''}`, open: () => editLancamento(l.id), action: { label: 'Recebido', fn: () => marcarPago(l.id) }, link: l.clienteId ? linkCobranca(l, 'atraso') : null });
  const pag = Calc.emAberto('saida', t);
  for (const l of pag.atrasados) items.push({ sev: 3, ic: 'coin', tone: 'bad', txt: `Conta atrasada: ${l.descricao}`, meta: `${money(l.valor)} · venceu ${relDay(l.vencimento)}`, open: () => editLancamento(l.id), action: { label: 'Paga', fn: () => marcarPago(l.id) } });
  for (const l of Store.all('lancamentos')) {
    if (!l.pagoEm && l.vencimento === t) items.push({ sev: 2, ic: 'coin', tone: 'warn', txt: `${l.tipo === 'entrada' ? 'Receber' : 'Pagar'} hoje: ${l.descricao}`, meta: money(l.valor), open: () => editLancamento(l.id), action: { label: l.tipo === 'entrada' ? 'Recebido' : 'Paga', fn: () => marcarPago(l.id) }, link: l.tipo === 'entrada' && l.clienteId ? linkCobranca(l, 'cobranca') : null });
  }
  if (A.lembreteCobranca) {
    const ate = addDays(t, A.diasCobranca);
    for (const l of rec.list) {
      if (!l.clienteId || !l.vencimento || l.vencimento <= t || l.vencimento > ate || l.lembreteEm) continue;
      items.push({ sev: 2, ic: 'bell', tone: 'blue', txt: `Lembrar ${clienteNome(l.clienteId)}: vence ${relDay(l.vencimento)}`, meta: `${l.descricao} · ${money(l.valor)}`, open: () => editLancamento(l.id), link: linkCobranca(l, 'cobranca', true), auto: true });
    }
  }
  for (const x of Calc.tarefasAbertas()) {
    if (!x.prazo) continue;
    if (x.prazo < t) items.push({ sev: 3, ic: 'check', tone: 'bad', txt: `Tarefa atrasada: ${x.titulo}`, meta: `${socioNome(x.responsavel)} · ${relDay(x.prazo)}`, open: () => editTarefa(x.id), action: { label: 'Concluir', fn: () => toggleTarefa(x.id) }, dono: x.responsavel });
    else if (x.prazo === t) items.push({ sev: 2, ic: 'check', tone: 'warn', txt: `Tarefa para hoje: ${x.titulo}`, meta: socioNome(x.responsavel), open: () => editTarefa(x.id), action: { label: 'Concluir', fn: () => toggleTarefa(x.id) }, dono: x.responsavel });
  }
  const pend = A.recorrencias && !S.readOnly ? [] : Calc.recPendentes(thisMonth());
  if (pend.length) items.push({ sev: 2, ic: 'repeat', tone: 'warn', txt: `${plural(pend.length, 'recorrência', 'recorrências')} de ${MESES[+thisMonth().slice(5, 7) - 1]} sem lançar`, meta: pend.map((r) => r.descricao).slice(0, 3).join(', '), open: () => { Fin.tab = 'recorrencias'; go('financeiro'); }, action: { label: 'Lançar', fn: () => lancarRecorrencias(thisMonth()) } });
  for (const p of Store.all('projetos')) {
    if (PROJ_ATIVOS.includes(p.status) && p.status !== 'pausado' && p.prazo && p.prazo < t) items.push({ sev: 2, ic: 'alert', tone: 'warn', txt: `Prazo vencido: ${p.titulo}`, meta: `${clienteNome(p.clienteId)} · ${relDay(p.prazo)}`, open: () => showProjeto(p.id) });
  }
  for (const l of Calc.leadsAbertos()) {
    if (!Calc.leadParado(l, A.diasParado, t)) continue;
    const d = Calc.diasNaEtapa(l);
    items.push({ sev: 1, ic: 'alert', tone: 'gray', txt: `${l.empresa} está parado em ${ETAPA[l.etapa].l.toLowerCase()}`, meta: `${d} dias sem avançar e sem próximo contato`, open: () => showLead(l.id), dono: l.responsavel, action: { label: 'Falar amanhã', fn: () => Store.patch('leads', l.id, { proximoContato: addDiasUteis(today(), 1), atualizadoEm: nowISO() }).then(() => toast(`Próximo contato com ${l.empresa}: ${relDay(addDiasUteis(today(), 1))}.`)).catch(() => {}) } });
  }
  return items.sort((a, b) => b.sev - a.sev);
}

function herdaDemo(refs = {}) {

/* ── toast ── */
function toast(msg, opts = {}) {
  const { type = 'info', action = null, onAction = null, ms = 4000 } = opts;
  const root = $('#toasts');
  if (!root) return () => {};
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  const s = document.createElement('span');
  s.textContent = msg;
  el.appendChild(s);
  let timer;
  const dismiss = () => {
    clearTimeout(timer);
    el.classList.remove('in');
    setTimeout(() => el.remove(), 220);
  };
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-act';
    b.type = 'button';
    b.textContent = action;
    b.onclick = () => {
      dismiss();
      if (onAction) onAction();
    };
    el.appendChild(b);
  }
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  timer = setTimeout(dismiss, ms);
  return dismiss;
}

/* ── modal ── */
function syncInert() {
  const app = document.getElementById('app');
  const dr = document.getElementById('drawer-root');
  const modal = !!document.querySelector('#modal-root .modal-wrap:not(.closing)');
  if (app) app.inert = modal || Drawer.isOpen();
  if (dr) dr.inert = modal;
}
const Modal = (() => {
  const stack = [];
  let seq = 0;
  function open({ title, body = '', actions = [{ label: 'Fechar' }], size = '', onOpen = null, onClose = null }) {
    const id = 'mdl' + ++seq;
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal-backdrop" data-close></div>
      <div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${id}_t">
        <div class="modal-h"><h2 id="${id}_t">${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">${ic('close')}</button></div>
        <div class="modal-b">${body}</div>
        <div class="modal-f"></div>
      </div>`;
    const prevFocus = document.activeElement;
    const api = { el: wrap, close };
    let closed = false;
    function close(result) {
      if (closed) return;
      closed = true;
      wrap.classList.remove('in');
      wrap.classList.add('closing');
      setTimeout(() => wrap.remove(), 160);
      const i = stack.indexOf(api);
      if (i >= 0) stack.splice(i, 1);
      syncInert();
      if (onClose) onClose(result);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus();
    }
    const foot = $('.modal-f', wrap);
    actions.forEach((a) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (a.kind ? ' btn-' + a.kind : '');
      b.textContent = a.label;
      b.onclick = async () => {
        if (!a.onClick) return close(a.value);
        b.disabled = true;
        try {
          const r = await a.onClick(wrap, api);
          if (r !== false) close(a.value);
        } catch (e) {
          console.error(e);
        } finally {
          b.disabled = false;
        }
      };
      foot.appendChild(b);
    });
    if (!actions.length) foot.remove();
    $$('[data-close]', wrap).forEach((el) => el.addEventListener('click', () => close()));
    $('#modal-root').appendChild(wrap);
    stack.push(api);
    syncInert();
    requestAnimationFrame(() => wrap.classList.add('in'));
    if (onOpen) onOpen(wrap, api);
    const first = $('.modal-b input:not([type=hidden]), .modal-b select, .modal-b textarea, .modal-b button', wrap) || $('.modal-f .btn-primary, .modal-f .btn-danger', wrap);
    setTimeout(() => first && first.focus(), 30);
    return api;
  }
  function top() { return stack[stack.length - 1] || null; }
  return { open, top };
})();

function confirmDialog({ title, text, confirm = 'Confirmar', danger = false, html = '' }) {
  return new Promise((resolve) => {
    let ok = false;
    Modal.open({
      title,
      body: (text ? `<p class="modal-text">${esc(text)}</p>` : '') + html,
      actions: [
        { label: 'Cancelar', kind: 'ghost' },
        { label: confirm, kind: danger ? 'danger' : 'primary', onClick: () => { ok = true; } },
      ],
      onClose: () => resolve(ok),
    });
  });
}

/* ── drawer lateral (detalhes e formulários) ── */
const Drawer = (() => {
  let cur = null;
  let el = null;
  function ensure() {
    if (el) return el;
    el = document.createElement('div');
    el.className = 'drawer-wrap';
    el.innerHTML = `<div class="drawer-backdrop" data-dclose></div>

const Pop = (() => {

    el.innerHTML = '';

    anchorEl = null;
  }

    el = $('#menuPop');
    if (anchorEl === anchor && !el.hidden) return close();

    anchorEl = anchor;
    anchor.setAttribute('aria-expanded', 'true');
    el.innerHTML = items
      .map((it, i) => (it.sep ? '<hr>' : `<button type="button" role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}">${it.ic ? ic(it.ic) : ''}<span>${esc(it.label)}</span>${it.hint ? `<kbd>${esc(it.hint)}</kbd>` : ''}</button>`))

    if (left < 8) left = Math.min(r.left, window.innerWidth - w - 8);
    let top = r.bottom + 6;

    el.style.left = left + 'px';
    el.style.top = top + 'px';

        if (it && it.fn) it.fn();

    const first = $('button', el);
    if (first) first.focus();

  document.addEventListener('pointerdown', (e) => {
    if (el && !el.hidden && !el.contains(e.target) && anchorEl && !anchorEl.contains(e.target)) close();

/* ── formulários ── */
let formSeq = 0;
function buildForm(fields, vals = {}) {

}
function fieldHTML(fid, f, v, vals) {

    case 'textarea':
      ctl = `<textarea id="${id}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v ?? '')}</textarea>`;
      break;
    case 'money':
      ctl = `<div class="affix"><span>R$</span><input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(moneyInputValue(v))}" data-money></div>`;
      break;
    case 'number':

      break;
    case 'date':

      break;
    case 'month':
      ctl = `<input id="${id}" type="month" value="${esc(v || '')}">`;
      break;
    case 'select': {
      const opts = (typeof f.opts === 'function' ? f.opts(vals) : f.opts) || [];
      ctl = `<select id="${id}">${selectOptions(opts, v, f.empty)}</select>`;
      break;
    }

      ctl = `<div class="chips" id="${id}" role="group" aria-label="${esc(f.l || '')}">${f.opts.map((o) => `<button type="button" class="chip" data-v="${esc(o.v)}" aria-pressed="${sel.has(o.v)}">${esc(o.l)}</button>`).join('')}</div>`;
      break;
    }
    case 'seg':
      ctl = `<div class="seg" id="${id}" role="radiogroup" aria-label="${esc(f.l || '')}">${f.opts.map((o) => `<button type="button" role="radio" data-v="${esc(o.v)}" aria-checked="${String(o.v) === String(v)}">${o.ic ? ic(o.ic) : ''}<span>${esc(o.l)}</span></button>`).join('')}</div>`;

  let firstBad = null;
  for (const f of fields) {
    const wrap = root.querySelector(`[data-form="${fid}"] .field[data-k="${CSS.escape(f.k)}"]`);
    if (!wrap) continue;
    const err = $('.err', wrap);

      else if (f.t === 'money' && v === null && fieldEl(root, fid, f.k).value.trim()) msg = 'Valor inválido. Use o formato 1.234,56.';

  }

}

/* ── minigráfico de tendência (6 meses) ── */
function spark(vals, label) {
  if (!vals.length || vals.every((v) => !v)) return '';
  const W = 96, H = 28, max = Math.max(...vals, 1);
  const x = (i) => 3 + (i / (vals.length - 1)) * (W - 6);
  const y = (v) => H - 4 - (v / max) * (H - 8);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}"><polygon class="sp-a" points="${x(0)},${H - 4} ${pts} ${x(last)},${H - 4}"/><polyline class="sp-l" points="${pts}"/><circle class="sp-d" cx="${x(last)}" cy="${y(vals[last])}" r="2.6"/></svg>`;
}

    else r.setAttribute('data-theme', atual);

    if (b) {
      const nome = { auto: 'automático', light: 'claro', dark: 'escuro' }[atual];

      b.setAttribute('aria-label', `Tema ${nome}. Clique para trocar`);

    }
  }

  }
  function ciclo() { set(atual === 'auto' ? 'light' : atual === 'light' ? 'dark' : 'auto'); }

const SVGNS = 'http://www.w3.org/2000/svg';
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * p;
}

  if (v === 0) return 'R$ 0';
  const a = Math.abs(v);
  const s = v < 0 ? '−' : '';
  if (a >= 1e6) return `${s}R$ ${fmtNum(a / 1e6, 1)} mi`;
  if (a >= 1e4) return `${s}R$ ${fmtNum(a / 1e3, 0)} mil`;
  return `${s}R$ ${fmtNum(a, 0)}`;
}
function barPath(x, w, y0, y1, r = 4) {
  // barra com ponta arredondada (lado do dado) e base reta (lado da linha de base)
  const h = Math.abs(y1 - y0);
  if (h < 0.5) return '';
  const rr = Math.min(r, h, w / 2);
  if (y1 < y0) {
    return `M${x},${y0}V${y1 + rr}Q${x},${y1} ${x + rr},${y1}H${x + w - rr}Q${x + w},${y1} ${x + w},${y1 + rr}V${y0}Z`;
  }
  return `M${x},${y0}V${y1 - rr}Q${x},${y1} ${x + rr},${y1}H${x + w - rr}Q${x + w},${y1} ${x + w},${y1 - rr}V${y0}Z`;

/* Registro de gráficos: a view declara, o mount desenha e redesenha ao redimensionar */
const Charts = (() => {
  const specs = new Map();
  const tableMode = new Set();
  const animated = new Set();
  const observed = new Set();
  let ro = null;
  function set(id, spec) { specs.set(id, spec); }
  function draw(el) {
    const id = el.dataset.chart;
    const spec = specs.get(id);
    if (!spec) return;
    const host = el;
    host.innerHTML = '';
    if (tableMode.has(id)) {
      host.appendChild(spec.table());
      return;
    }
    // anima só a primeira vez que cada gráfico aparece na sessão
    const first = !animated.has(id);
    animated.add(id);
    spec.draw(host, first && !reduceMotion());
  }
  function mount(root) {
    for (const el of observed) {

      ro = new ResizeObserver((entries) => {
        for (const e of entries) {
          const el = e.target;
          const w = Math.round(e.contentRect.width);
          if (el.dataset.w && +el.dataset.w === w) continue;
          el.dataset.w = w;
          if (el.isConnected) draw(el);
        }
      });
    }
    $$('[data-chart]', root).forEach((el) => {
      draw(el);
      el.dataset.w = Math.round(el.clientWidth);
      if (ro) {
        ro.observe(el);
        observed.add(el);
      }
    });
    $$('[data-tview]', root).forEach((b) => {
      const id = b.dataset.tview;
      b.setAttribute('aria-pressed', String(tableMode.has(id)));
      b.onclick = () => {
        if (tableMode.has(id)) tableMode.delete(id);
        else tableMode.add(id);
        b.setAttribute('aria-pressed', String(tableMode.has(id)));
        b.innerHTML = tableMode.has(id) ? `${ic('chart')}<span>Gráfico</span>` : `${ic('table')}<span>Tabela</span>`;
        const el = root.querySelector(`[data-chart="${CSS.escape(id)}"]`);
        if (el) draw(el);
      };
      b.innerHTML = tableMode.has(id) ? `${ic('chart')}<span>Gráfico</span>` : `${ic('table')}<span>Tabela</span>`;
    });
  }
  function redrawAll() { for (const el of observed) if (el.isConnected) draw(el); }
  return { set, mount, draw, redrawAll };
})();

function simpleTable(head, rows, numericFrom = 1) {
  const t = document.createElement('table');
  t.className = 'tbl tbl-compact';
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  head.forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h;
    if (i >= numericFrom) th.className = 'num';
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  t.appendChild(thead);
  const tb = document.createElement('tbody');
  rows.forEach((r) => {
    const row = document.createElement('tr');
    r.forEach((c, i) => {
      const td = document.createElement('td');
      td.textContent = c;
      if (i >= numericFrom) td.className = 'num';
      row.appendChild(td);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb);
  const wrap = document.createElement('div');
  wrap.className = 'tbl-wrap';
  wrap.appendChild(t);
  return wrap;
}

/* ── Entradas (para cima) × saídas (para baixo), resultado como ponto ── */
function flowChartSpec(data, curMonth) {
  return {
    table: () => simpleTable(['Mês', 'Entradas', 'Saídas', 'Resultado'], data.map((d) => [monthLabel(d.m), money(d.entradas), money(d.saidas), signedMoney0(d.resultado)])),
    draw(host, animate) {
      const W = Math.max(300, host.clientWidth);
      const H = Math.max(236, Math.min(440, host.clientHeight - 24));
      const padL = 70;
      const padR = 8;
      const padT = 12;
      const padB = 28;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxIn = Math.max(0, ...data.map((d) => d.entradas), ...data.map((d) => d.resultado));
      const maxOut = Math.max(0, ...data.map((d) => d.saidas), ...data.map((d) => -d.resultado));
      const step = niceStep(Math.max(maxIn, maxOut, 1) / 2.2);
      const top = Math.max(step, Math.ceil(maxIn / step) * step);
      const bot = Math.ceil(maxOut / step) * step;
      const y = (v) => padT + ((top - v) / (top + bot || 1)) * plotH;
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: 'chart', role: 'img', 'aria-label': 'Entradas e saídas por mês' });
      // grade + eixo
      for (let v = -bot; v <= top + 0.01; v += step) {
        const yy = Math.round(y(v)) + 0.5;
        svgEl('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: v === 0 ? 'c-base' : 'c-grid' }, svg);
        const t = svgEl('text', { x: padL - 10, y: yy + 4, 'text-anchor': 'end', class: 'c-tick' }, svg);
        t.textContent = axisMoney(v);
      }
      const n = data.length;
      const bw = plotW / n;
      const barW = Math.min(24, Math.max(10, bw * 0.34));
      const y0 = y(0);
      data.forEach((d, i) => {
        const cx = padL + bw * i + bw / 2;
        const x = cx - barW / 2;
        const g = svgEl('g', { class: 'c-band' + (d.m === curMonth ? ' cur' : '') }, svg);
        const pIn = barPath(x, barW, y0, y(d.entradas));
        if (pIn) svgEl('path', { d: pIn, class: 'c-in' + (animate ? ' grow-up' : ''), style: animate ? `animation-delay:${i * 50}ms` : '' }, g);
        const pOut = barPath(x, barW, y0 + 1, y(-d.saidas) + 1);
        if (pOut) svgEl('path', { d: pOut, class: 'c-out' + (animate ? ' grow-down' : ''), style: animate ? `animation-delay:${i * 50 + 80}ms` : '' }, g);
        if (d.entradas || d.saidas) svgEl('circle', { cx, cy: y(d.resultado), r: 4.5, class: 'c-dot' + (animate ? ' fade' : ''), style: animate ? `animation-delay:${400 + i * 50}ms` : '' }, g);
        const lab = svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: 'c-xl' + (d.m === curMonth ? ' cur' : '') }, svg);
        lab.textContent = monthLabel(d.m, 'short') + (d.m.slice(5) === '01' ? ' ' + d.m.slice(2, 4) : '');
        const hit = svgEl('rect', { x: padL + bw * i, y: padT, width: bw, height: plotH, class: 'c-hit', tabindex: 0, 'aria-label': `${monthLabel(d.m)}: entradas ${money(d.entradas)}, saídas ${money(d.saidas)}, resultado ${signedMoney0(d.resultado)}` }, svg);
        const showTip = (px, py) => {
          g.classList.add('hover');
          Tip.show(px, py, monthLabel(d.m), [
            { color: 'var(--series-in)', value: money(d.entradas), label: 'Entradas' },
            { color: 'var(--series-out)', value: money(d.saidas), label: 'Saídas' },
            { color: 'var(--ink)', shape: 'dot', value: signedMoney0(d.resultado), label: 'Resultado' },
          ]);
        };
        hit.addEventListener('pointermove', (e) => showTip(e.clientX, e.clientY));
        hit.addEventListener('pointerdown', (e) => { $$('.c-band.hover', svg).forEach((x) => x.classList.remove('hover')); showTip(e.clientX, e.clientY); });
        hit.addEventListener('pointerleave', (e) => { if (e.pointerType === 'touch') return; g.classList.remove('hover'); Tip.hide(); });
        hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top + 30); });
        hit.addEventListener('blur', () => { g.classList.remove('hover'); Tip.hide(); });
      });
      host.appendChild(svg);
    },
  };
}

/* ── barras horizontais (ranking ou etapas ordenadas) ── */
function hbarSpec(rows, { fmt = (v) => fmtNum(v), colors = null, head = ['Item', 'Valor'], tableRow = null, empty = 'Sem dados ainda.' } = {}) {
  return {
    table: () => simpleTable(head, rows.map((r) => (tableRow ? tableRow(r) : [r.label, fmt(r.value)]))),
    draw(host, animate) {
      if (!rows.length || rows.every((r) => !r.value)) {
        host.innerHTML = `<p class="chart-empty">${esc(empty)}</p>`;
        return;
      }
      const max = Math.max(...rows.map((r) => r.value), 1);
      const wrap = document.createElement('div');
      wrap.className = 'hb';
      rows.forEach((r, i) => {
        const row = document.createElement('div');
        row.className = 'hb-row';
        row.tabIndex = 0;
        const l = document.createElement('div');
        l.className = 'hb-l';
        const lt = document.createElement('span');
        lt.textContent = r.label;
        l.appendChild(lt);
        if (r.sub) {
          const s = document.createElement('small');
          s.textContent = r.sub;
          l.appendChild(s);
        }
        const tr = document.createElement('div');
        tr.className = 'hb-track';
        const bar = document.createElement('i');
        bar.style.width = (r.value > 0 ? Math.max(1.5, (r.value / max) * 100) : 0) + '%';
        bar.style.background = colors ? colors[i % colors.length] : 'var(--series-in)';
        if (animate) {
          bar.classList.add('grow-x');
          bar.style.animationDelay = i * 45 + 'ms';
        }
        tr.appendChild(bar);
        const v = document.createElement('div');
        v.className = 'hb-v';
        v.textContent = fmt(r.value);
        row.append(l, tr, v);
        const tipRows = r.tip || [{ value: fmt(r.value), label: r.label }];
        row.addEventListener('pointermove', (e) => Tip.show(e.clientX, e.clientY, r.label, tipRows));
        row.addEventListener('pointerdown', (e) => Tip.show(e.clientX, e.clientY, r.label, tipRows));
        row.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') Tip.hide(); });
        row.addEventListener('focus', () => { const b = row.getBoundingClientRect(); Tip.show(b.left + b.width * 0.6, b.top + 6, r.label, tipRows); });
        row.addEventListener('blur', () => Tip.hide());
        if (r.onClick) {
          row.classList.add('click');
          row.addEventListener('click', r.onClick);
          row.addEventListener('keydown', (e) => { if (e.key === 'Enter') r.onClick(); });
        }
        wrap.appendChild(row);
      });
      host.appendChild(wrap);
    },
  };
}

/* ── projeção de saldo (linha + área) ── */
function lineSpec(pts) {
  return {
    table: () => {
      const rows = pts.filter((p, i) => i % 7 === 0 || i === pts.length - 1).map((p) => [fmtDate(p.d), money(p.v)]);
      return simpleTable(['Data', 'Saldo projetado'], rows);
    },
    draw(host, animate) {
      const W = Math.max(300, host.clientWidth);
      const H = 250;
      const padL = 72;
      const padR = 16;
      const padT = 18;
      const padB = 28;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const vals = pts.map((p) => p.v);
      let lo = Math.min(0, ...vals);
      let hi = Math.max(...vals, 1);
      const step = niceStep((hi - lo) / 4 || 1);
      lo = Math.floor(lo / step) * step;
      hi = Math.ceil(hi / step) * step;
      if (hi === lo) hi = lo + step;
      const x = (i) => padL + (i / (pts.length - 1)) * plotW;
      const y = (v) => padT + ((hi - v) / (hi - lo)) * plotH;
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: 'chart', role: 'img', 'aria-label': 'Projeção do saldo em caixa' });
      for (let v = lo; v <= hi + 0.01; v += step) {
        const yy = Math.round(y(v)) + 0.5;
        svgEl('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: v === 0 ? 'c-base' : 'c-grid' }, svg);
        const t = svgEl('text', { x: padL - 10, y: yy + 4, 'text-anchor': 'end', class: 'c-tick' }, svg);
        t.textContent = axisMoney(v);
      }
      const every = pts.length > 60 ? 15 : 7;
      pts.forEach((p, i) => {
        if (i % every !== 0) return;
        const t = svgEl('text', { x: x(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : 'middle', class: 'c-xl' }, svg);
        t.textContent = i === 0 ? 'hoje' : fmtDateShort(p.d);
      });
      const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
      const base = y(Math.max(lo, Math.min(0, hi)));
      svgEl('path', { d: `${line}L${x(pts.length - 1)},${base}L${x(0)},${base}Z`, class: 'c-area' }, svg);
      const lp = svgEl('path', { d: line, class: 'c-line' + (animate ? ' draw' : '') }, svg);
      if (animate) {
        const len = lp.getTotalLength ? lp.getTotalLength() : 1000;
        lp.style.strokeDasharray = len;
        lp.style.strokeDashoffset = len;
      }
      // rótulos seletivos: ponto final e mínimo
      const last = pts.length - 1;
      let minI = 0;
      pts.forEach((p, i) => { if (p.v < pts[minI].v) minI = i; });
      const label = (i, txt, below) => {
        svgEl('circle', { cx: x(i), cy: y(pts[i].v), r: 4.5, class: 'c-end' }, svg);
        const anchor = i > pts.length * 0.8 ? 'end' : i < pts.length * 0.15 ? 'start' : 'middle';
        const t = svgEl('text', { x: x(i), y: y(pts[i].v) + (below ? 18 : -10), 'text-anchor': anchor, class: 'c-lab' }, svg);
        t.textContent = txt;
      };
      if (minI > 0 && minI < last && pts[minI].v < pts[0].v - 1) label(minI, `mínimo ${money0(pts[minI].v)}`, true);
      label(last, money0(pts[last].v), false);
      // mira
      const cross = svgEl('line', { x1: 0, x2: 0, y1: padT, y2: padT + plotH, class: 'c-cross', visibility: 'hidden' }, svg);
      const dot = svgEl('circle', { r: 4.5, class: 'c-end', visibility: 'hidden' }, svg);
      const hit = svgEl('rect', { x: padL, y: padT, width: plotW, height: plotH, class: 'c-hit', tabindex: 0, 'aria-label': 'Use as setas para percorrer a projeção' }, svg);
      let idx = 0;
      const showAt = (i, cx, cy) => {
        idx = Math.max(0, Math.min(last, i));
        const p = pts[idx];
        cross.setAttribute('x1', x(idx));
        cross.setAttribute('x2', x(idx));
        cross.setAttribute('visibility', 'visible');
        dot.setAttribute('cx', x(idx));
        dot.setAttribute('cy', y(p.v));
        dot.setAttribute('visibility', 'visible');
        const rows = [{ color: 'var(--series-in)', value: money(p.v), label: 'Saldo projetado' }];
        p.itens.slice(0, 4).forEach((it) => rows.push({ value: signedMoney0(it.v), label: it.desc }));
        if (p.itens.length > 4) rows.push({ value: `+${p.itens.length - 4}`, label: 'outros lançamentos' });
        const r = svg.getBoundingClientRect();
        Tip.show(cx ?? r.left + (x(idx) / W) * r.width, cy ?? r.top + (y(p.v) / H) * r.height, idx === 0 ? 'Hoje' : `${weekdayLabel(p.d)}, ${fmtDate(p.d)}`, rows);
      };
      const hideX = () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); Tip.hide(); };
      const fromPointer = (e) => {
        const r = svg.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        showAt(Math.round(((px - padL) / plotW) * last), e.clientX, e.clientY);
      };
      hit.addEventListener('pointermove', fromPointer);
      hit.addEventListener('pointerdown', fromPointer);
      hit.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') hideX(); });
      hit.addEventListener('focus', () => showAt(idx));
      hit.addEventListener('blur', hideX);
      hit.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { showAt(idx + 1); e.preventDefault(); }
        if (e.key === 'ArrowLeft') { showAt(idx - 1); e.preventDefault(); }
      });
      host.appendChild(svg);
      if (animate) requestAnimationFrame(() => lp.classList.add('go'));
    },
  };
}

function meter(frac, tone = '') {

}

async function busy(btn, fn) {
  if (!btn || btn.disabled) return;
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Salvando…';
  try {
    return await fn();
  } finally {
    if (btn.isConnected) {
      btn.disabled = false;
      btn.innerHTML = old;
    }
  }
}

      bindMoreToggle(el);
      if (!cur) bindColar(el, fid);
      on(el, '[data-cancel]', 'click', () => (cur ? showLead(cur.id) : Drawer.close()));
      on(el, '[data-save]', 'click', (e, btn) =>
        busy(btn, async () => {
          const v = readForm(el, fid, fields);
          if (!validateForm(el, fid, fields, v)) return;
          await saveLead(cur, v);
        })
      );
    },
  });
}

async function saveLead(cur, v) {
  const t = nowISO();
  try {
    if (cur) {
      const changes = { ...v, atualizadoEm: t };
      let fu = null;
      if (v.etapa !== cur.etapa) {
        changes.etapaDesde = today();
        changes.historico = [...(cur.historico || []), { tipo: 'etapa', texto: `${ETAPA[cur.etapa].l} → ${ETAPA[v.etapa].l}`, data: t, autor: S.me }];
        // se a pessoa não mexeu no próximo contato, o piloto agenda pela etapa nova
        if ((v.proximoContato || '') === (cur.proximoContato || '')) {
          fu = followupAuto({ ...cur, ...v }, v.etapa);
          if (fu) Object.assign(changes, fu);
        }
      }
      await Store.patch('leads', cur.id, changes);
      if (fu) logFollowup(cur, fu);
      toast(fu ? `Lead atualizado. Próximo contato ${relDay(fu.proximoContato)}: ${fu.proximaAcao.toLowerCase()}.` : 'Lead atualizado.');
      showLead(cur.id);
    } else {
      const id = newId('ld');
      await Store.put('leads', id, { ...v, criadoEm: t, atualizadoEm: t, etapaDesde: today(), criadoPor: S.me, historico: [{ tipo: 'criado', texto: 'Lead criado', data: t, autor: S.me }] });
      toast(`${v.empresa} entrou no funil.`, { action: 'Abrir', onAction: () => showLead(id) });
      Drawer.close();
    }
  } catch (e) {
    /* o erro já foi avisado */
  }
}

/* ── o que fazer agora com o lead (cartão no topo do lead) ── */
function detalhesLead(l) {
  return [`Lead: ${l.empresa}`, l.contato ? `Contato: ${l.contato}` : '', l.telefone ? `Telefone: ${l.telefone}` : '', l.telefone && waLink(l.telefone) ? `WhatsApp: ${waLink(l.telefone)}` : '', l.email ? `E-mail: ${l.email}` : '', l.proximaAcao ? `Próxima ação: ${l.proximaAcao}` : '', '', 'Criado pelo Prisma CRM'].filter((x, i, a) => x || i === a.length - 2).join('\n');
}
function sugestaoLead(l) {
  if (!ABERTAS.includes(l.etapa)) return null;
  const t = today();
  const acts = [];
  const zap = (tipo, label = 'Mandar no WhatsApp') => {
    const href = waMsgLink(l.telefone, msgLead(l, tipo));
    if (href) acts.push({ href, label, ic: 'whatsapp', msg: tipo });
  };
  let titulo = '';
  let texto = '';
  let tone = 'blue';
  if (l.proximoContato && l.proximoContato < t) {
    titulo = 'Retomar o contato atrasado';
    texto = `Era para falar com ${l.contato ? primeiroNome(l.contato) : l.empresa} ${relDay(l.proximoContato)}${l.proximaAcao ? `: ${l.proximaAcao.charAt(0).toLowerCase()}${l.proximaAcao.slice(1)}` : ''}.`;
    tone = 'bad';
    zap(msgLeadTipo(l));
    acts.push({ fn: 'amanha', label: 'Passar para amanhã', ic: 'clock' });
  } else if (l.etapa === 'novo') {
    titulo = 'Fazer o primeiro contato';
    texto = 'Lead novo costuma responder melhor nas primeiras horas.';
    zap('primeiroContato');
    acts.push({ fn: 'stage:contato', label: 'Já falei: Em contato', ic: 'arrow' });
  } else if (l.etapa === 'contato') {
    titulo = 'Marcar a conversa de diagnóstico';
    texto = 'Meia hora para entender o processo, o prazo e o orçamento do cliente.';
    acts.push({ href: gcalLink(`Diagnóstico: ${l.empresa}`, l.proximoContato && l.proximoContato >= t ? l.proximoContato : addDiasUteis(t, 1), detalhesLead(l)), label: 'Marcar no Google Agenda', ic: 'agenda' });
    acts.push({ fn: 'stage:diagnostico', label: 'Mover para Diagnóstico', ic: 'arrow' });
  } else if (l.etapa === 'diagnostico') {
    titulo = 'Montar e enviar a proposta';
    texto = 'Com o diagnóstico feito, a proposta precisa sair enquanto o assunto está quente.';
    acts.push({ fn: 'tarefa', label: 'Criar tarefa da proposta', ic: 'check' });
    acts.push({ fn: 'stage:proposta', label: 'Proposta enviada', ic: 'arrow' });
  } else if (l.etapa === 'proposta') {
    const d = Calc.diasNaEtapa(l);
    if (d >= 3) {
      titulo = 'Cobrar o retorno da proposta';
      texto = `A proposta foi enviada há ${plural(d, 'dia', 'dias')}.`;
      zap('proposta');
    } else {
      titulo = 'Aguardar o retorno da proposta';
      texto = `Sem resposta, vale cobrar ${relDay(addDiasUteis(l.etapaDesde || t, 3))}.`;
    }
    acts.push({ fn: 'stage:negociacao', label: 'Respondeu: Negociação', ic: 'arrow' });
  } else if (l.etapa === 'negociacao') {
    titulo = 'Fechar a venda';
    texto = 'Combinadas as condições, use Marcar como ganho: o CRM cria o cliente, o projeto, as parcelas e as tarefas de uma vez.';
    zap('fechamento', 'Mandar a mensagem de fechamento');
  }
  if (!l.telefone && !l.email) acts.push({ fn: 'editar', label: 'Adicionar telefone', ic: 'phone' });
  return { titulo, texto, tone, acts };
}

async function moveLead(id, stage) {
  const l = Store.get('leads', id);
  if (!l || l.etapa === stage) return;
  if (S.readOnly) return toast('Você tem acesso somente de leitura.', { type: 'error' });
  if (stage === 'ganho') return winFlow({ leadId: id });
  if (stage === 'perdido') return loseFlow(id);
  const t = nowISO();
  const de = ETAPA[l.etapa] ? ETAPA[l.etapa].l : l.etapa;
  const fu = followupAuto(l, stage);
  try {
    await Store.patch('leads', id, {
      etapa: stage,
      etapaDesde: today(),
      atualizadoEm: t,
      historico: [...(l.historico || []), { tipo: 'etapa', texto: `${de} → ${ETAPA[stage].l}`, data: t, autor: S.me }],
      ...(fu || {}),
    });
    if (fu) {
      logFollowup(l, fu);
      toast(`${l.empresa} foi para ${ETAPA[stage].l}. Próximo contato ${relDay(fu.proximoContato)}: ${fu.proximaAcao.charAt(0).toLowerCase()}${fu.proximaAcao.slice(1)}.`, { action: 'Abrir', ms: 5000, onAction: () => showLead(id) });
    } else toast(`Lead movido para ${ETAPA[stage].l}: ${l.empresa}.`);
  } catch {}
}

function loseFlow(id) {
  const l = Store.get('leads', id);
  if (!l) return;
  const fields = [
    { k: 'motivo', l: 'Motivo', t: 'select', opts: optList(cfg().motivosPerda), req: true, empty: 'Selecione' },
    { k: 'obs', l: 'Detalhes', t: 'textarea', ph: 'Opcional: o que aprender com essa negociação' },
  ];
  const { fid, html } = buildForm(fields, {});
  Modal.open({
    title: `Marcar ${l.empresa} como perdido`,
    body: html,
    onOpen: (root) => bindForm(root, fid, fields),
    actions: [
      { label: 'Cancelar', kind: 'ghost' },

        onClick: async (root) => {

            });

        },
      },

  });
}

/* ══════════ FECHAR VENDA (lead → cliente + projeto + parcelas) ══════════ */
function planoParcelas(v) {
  const total = round2(v.valor || 0);
  if (!(total > 0) || v.pagamento === 'nenhum') return [];
  const first = v.primeiroVenc || today();
  const n = Math.max(1, Math.min(36, Math.round(+v.parcelas || 1)));
  const pctE = Math.min(99, Math.max(1, +v.entradaPct || 50)) / 100;
  const split = (amount, k) => {
    const base = Math.floor((amount * 100) / k) / 100;
    const arr = Array(k).fill(base);
    arr[k - 1] = round2(amount - base * (k - 1));
    return arr;
  };
  const out = [];
  if (v.pagamento === 'avista') out.push({ label: 'Pagamento à vista', venc: first, valor: total });
  else if (v.pagamento === 'metade') {
    const e = round2(total * pctE);
    out.push({ label: 'Entrada', venc: first, valor: e });
    out.push({ label: 'Saldo na entrega', venc: v.segundoVenc || v.prazo || addDays(first, 30), valor: round2(total - e) });
  } else if (v.pagamento === 'entrada_parcelas') {
    const e = round2(total * pctE);
    out.push({ label: 'Entrada', venc: first, valor: e });
    split(round2(total - e), n).forEach((x, i) => out.push({ label: `Parcela ${i + 1}/${n}`, venc: addMonths(first, i + 1), valor: x }));
  } else if (v.pagamento === 'parcelado') {
    split(total, n).forEach((x, i) => out.push({ label: `Parcela ${i + 1}/${n}`, venc: addMonths(first, i), valor: x }));
  }
  return out;
}

function winFlow({ leadId = null, clienteId = null } = {}) {
  const lead = leadId ? Store.get('leads', leadId) : null;
  const temClientes = Store.all('clientes').length > 0;
  const pre = clienteId || (lead && lead.clienteId && Store.get('clientes', lead.clienteId) ? lead.clienteId : '');
  const servico = (lead && lead.servicos && lead.servicos[0]) || 'site';
  const vals = {
    clienteModo: pre ? 'existente' : lead || !temClientes ? 'novo' : 'existente',
    clienteId: pre,
    nome: lead ? lead.empresa : '',
    contato: lead ? lead.contato || '' : '',
    telefone: lead ? lead.telefone || '' : '',
    titulo: lead ? `${SERVICO[servico]} — ${lead.empresa}` : '',
    servico,
    valor: lead ? lead.valor || null : null,
    dataFechamento: today(),

async function registrarVenda(v, lead) {
  const t = nowISO();
  const demo = herdaDemo({ leadId: lead && lead.id, clienteId: v.clienteModo === 'novo' ? null : v.clienteId });
  try {
    let cid = v.clienteId;
    let nomeCliente = clienteNome(cid);
    if (v.clienteModo === 'novo') {
      cid = newId('cl');
      nomeCliente = v.nome;
      await Store.put('clientes', cid, {
        nome: v.nome,
        contato: v.contato || '',
        telefone: v.telefone || '',
        email: lead ? lead.email || '' : '',
        segmento: lead ? lead.segmento || '' : '',
        cidade: lead ? lead.cidade || '' : '',
        site: lead ? lead.site || '' : '',
        origem: lead ? lead.origem || '' : '',
        documento: '',
        desde: v.dataFechamento,
        leadId: lead ? lead.id : null,
        notas: '',
        criadoEm: t,
        criadoPor: S.me,
        ...demo,
      });
    }
    const pid = newId('pj');
    await Store.put('projetos', pid, {
      titulo: v.titulo,
      clienteId: cid,
      servico: v.servico,
      valor: v.valor,
      dataFechamento: v.dataFechamento,
      prazo: v.prazo || '',
      status: 'planejamento',
      vendedor: v.vendedor,
      executor: v.executor,
      leadId: lead ? lead.id : null,
      pagamento: { tipo: v.pagamento, entradaPct: v.entradaPct, parcelas: v.parcelas, forma: v.forma },
      notas: '',
      criadoEm: t,
      criadoPor: S.me,
      ...demo,
    });
    const plano = planoParcelas(v);
    let jaRecebida = null;
    for (let i = 0; i < plano.length; i++) {
      const p = plano[i];
      const lid = newId('lc');
      if (i === 0 && v.entradaRecebida) jaRecebida = lid;
      await Store.put('lancamentos', lid, {
        tipo: 'entrada',
        descricao: `${v.titulo} · ${p.label}`,
        valor: p.valor,
        categoria: 'Projetos',
        vencimento: p.venc,
        pagoEm: i === 0 && v.entradaRecebida ? today() : null,
        forma: v.forma,
        clienteId: cid,
        projetoId: pid,
        criadoEm: t,
        criadoPor: S.me,
        ...demo,
      });
    }
    if (v.manutencao > 0) {
      await Store.put('recorrencias', newId('rc'), {
        tipo: 'entrada',
        descricao: `Manutenção — ${nomeCliente}`,
        valor: v.manutencao,
        categoria: 'Manutenção & mensalidades',
        frequencia: 'mensal',
        dia: Math.min(31, Math.max(1, +v.manutencaoDia || 10)),
        mesAnual: null,
        inicio: monthAdd(monthOf(v.dataFechamento), 1),
        fim: '',
        ativo: true,
        clienteId: cid,
        projetoId: pid,
        forma: v.forma || 'Pix',
        criadoEm: t,
        criadoPor: S.me,
        ...demo,
      });
    }
    registrarVenda.tarefas = 0;
    try { registrarVenda.tarefas = await checklistVenda(pid, v, demo); } catch (e) { console.warn('checklist', e); }
    if (jaRecebida) {
      const lr = Store.get('lancamentos', jaRecebida) || { id: jaRecebida, tipo: 'entrada', clienteId: cid, projetoId: pid, valor: plano[0].valor, descricao: `${v.titulo} · ${plano[0].label}`, ...demo };
      try { await notaFiscalAuto(lr); } catch {}
    }
    if (lead) {
      await Store.patch('leads', lead.id, {
        etapa: 'ganho',
        etapaDesde: today(),
        fechadoEm: v.dataFechamento,
        clienteId: cid,
        projetoId: pid,
        atualizadoEm: t,
        historico: [...(lead.historico || []), { tipo: 'ganho', texto: `Venda fechada: ${v.titulo} · ${money(v.valor)}`, data: t, autor: S.me }],
      });
    }
    return pid;
  } catch (e) {
    console.warn(e);
    return null;
  }
}

function monthOptions(cur, from = -18, to = 24) {
  const base = thisMonth();
  const list = [];
  for (let i = from; i <= to; i++) list.push(monthAdd(base, i));
  if (cur && !list.includes(cur)) list.push(cur);
  return list.sort().map((m) => ({ v: m, l: monthLabel(m) }));
}

let lancandoRec = false;
async function lancarRecorrencias(m) {
  if (lancandoRec) return;
  const pend = Calc.recPendentes(m);
  if (!pend.length) return toast(`Nada para lançar em ${monthLabel(m).toLowerCase()}.`);
  lancandoRec = true;
  let n = 0;
  try {
    for (const r of pend) {
      if (await criarSeNaoExiste('lancamentos', Calc.recLancId(r.id, m), corpoRecorrencia(r, m))) n++;
    }
  } catch {
    /* aviso já exibido */
  } finally {
    lancandoRec = false;
  }
  if (n) toast(`${plural(n, 'lançamento criado', 'lançamentos criados')} em ${monthLabel(m).toLowerCase()}.`);
}

function optVinculos() {

  Store.all('clientes').sort((a, b) => byName(a.nome, b.nome)).forEach((c) => out.push({ v: `cliente:${c.id}`, l: `Cliente · ${c.nome}` }));
  Store.all('projetos').filter((p) => PROJ_ATIVOS.includes(p.status)).sort((a, b) => byName(a.titulo, b.titulo)).forEach((p) => out.push({ v: `projeto:${p.id}`, l: `Projeto · ${p.titulo}` }));
  return out;
}
function vinculoLabel(v) {
  if (!v) return '';
  const [tipo, id] = String(v).split(':');
  if (tipo === 'lead') { const l = Store.get('leads', id); return l ? l.empresa : ''; }
  if (tipo === 'cliente') { const c = Store.get('clientes', id); return c ? c.nome : ''; }
  if (tipo === 'projeto') { const p = Store.get('projetos', id); return p ? p.titulo : ''; }
  return '';
}

            toast(cur ? 'Tarefa atualizada.' : 'Tarefa criada.');
            Drawer.close();
          } catch {}
        })
      );
    },
  });
}
async function toggleTarefa(id) {
  const x = Store.get('tarefas', id);
  if (!x) return;
  const feita = !x.feita;
  try {
    await Store.patch('tarefas', id, { feita, feitaEm: feita ? today() : null, concluidaPor: feita ? S.me : null });
  } catch {
    return;
  }
  if (feita) toast(`Concluída: ${x.titulo}`, { action: 'Desfazer', ms: 5000, onAction: () => Store.patch('tarefas', id, { feita: false, feitaEm: null }).catch(() => {}) });
}

/* ── excluir com desfazer ── */
function deleteRecord(col, id, { titulo = 'Excluir?', texto = '', feito = 'Excluído.', html = '', before = null } = {}) {
  const r = Store.get(col, id);
  if (!r) return Promise.resolve(false);
  return new Promise((resolve) => {
    let ok = false;
    Modal.open({
      title: titulo,
      body: `<p class="modal-text">${esc(texto || 'Você pode desfazer logo depois, pelo aviso que aparece embaixo.')}</p>${html}`,
      actions: [
        { label: 'Cancelar', kind: 'ghost' },
        {
          label: 'Excluir',
          kind: 'danger',
          onClick: async (root) => {
            if (before) before(root);
            const data = { ...r };
            try {
              await Store.remove(col, id);
            } catch {
              return false;
            }
            ok = true;
            // lançamento gerado por recorrência: o mês fica marcado como pulado para não ser lançado de novo
            const rec = col === 'lancamentos' && r.recorrenciaId && r.competencia ? Store.get('recorrencias', r.recorrenciaId) : null;
            if (rec && !(rec.pulados || []).includes(r.competencia)) Store.patch('recorrencias', rec.id, { pulados: [...(rec.pulados || []), r.competencia] }).catch(() => {});
            toast(feito, {
              action: 'Desfazer',
              ms: 7000,
              onAction: async () => {
                try { await Store.put(col, id, data); } catch { return; }
                const rr = rec && Store.get('recorrencias', rec.id);
                if (rr) Store.patch('recorrencias', rr.id, { pulados: (rr.pulados || []).filter((m) => m !== r.competencia) }).catch(() => {});
              },
            });
          },
        },
      ],
      onClose: () => resolve(ok),
    });
  });
}

/* ── busca global ── */
function searchAll(q) {
  const n = norm(q).trim();
  if (n.length < 2) return [];
  const hit = (...xs) => xs.some((x) => norm(x).includes(n));
  const out = [];
  for (const l of Store.all('leads')) if (hit(l.empresa, l.contato, l.email, l.telefone, l.cidade)) out.push({ kind: 'Lead', ic: 'funil', title: l.empresa, sub: `${ETAPA[l.etapa] ? ETAPA[l.etapa].l : ''}${l.contato ? ' · ' + l.contato : ''}`, open: () => showLead(l.id), rank: ABERTAS.includes(l.etapa) ? 0 : 2 });
  for (const c of Store.all('clientes')) if (hit(c.nome, c.contato, c.email, c.telefone, c.documento)) out.push({ kind: 'Cliente', ic: 'clientes', title: c.nome, sub: c.contato || c.segmento || '', open: () => showCliente(c.id), rank: 1 });
  for (const p of Store.all('projetos')) if (hit(p.titulo, clienteNome(p.clienteId))) out.push({ kind: 'Projeto', ic: 'projetos', title: p.titulo, sub: clienteNome(p.clienteId), open: () => showProjeto(p.id), rank: 1 });
  for (const l of Store.all('lancamentos')) if (hit(l.descricao)) out.push({ kind: 'Lançamento', ic: 'financeiro', title: l.descricao, sub: `${money(l.valor)} · ${fmtDate(l.vencimento)}`, open: () => editLancamento(l.id), rank: 3 });
  return out.sort((a, b) => a.rank - b.rank || byName(a.title, b.title)).slice(0, 9);
}

function delta(cur, prev, upGood, prevMonth) {
  if (!prev) return '';
  const r = (cur - prev) / Math.abs(prev);
  if (Math.abs(r) < 0.005) return `<span class="delta flat">igual a ${monthLabel(prevMonth, 'short')}</span>`;
  const good = r > 0 === upGood;
  return `<span class="delta ${good ? 'up-good' : 'up-bad'}">${ic(r > 0 ? 'trend-up' : 'trend-down')}${pct(Math.abs(r))} vs ${monthLabel(prevMonth, 'short')}</span>`;
}

  const real = (col) => Store.all(col).filter((r) => !r.demo);

  return [

    { k: 'lead', t: 'Coloque os leads no funil', d: 'Importe as conversas do WhatsApp: o Claude lê e preenche cada lead.', ok: real('leads').length > 0, b: 'Importar conversas', fn: () => abrirConversas() },

    outro && Host ? { k: 'socio', t: `Chame o ${socioNome(outro)}`, d: `Gere um código de acesso e mande para o ${socioNome(outro)}. Ele cria a senha e entra no CRM.`, ok: !!outroEntrou || Conta.ativo(outro), b: 'Gerar código', fn: () => Conta.convite(outro) } : null,
    outro && !Host ? { k: 'socio', t: `Chame o ${socioNome(outro)}`, d: `Compartilhe o CRM com o ${socioNome(outro)} como Editor. Vale assim que ele registrar algo.`, ok: !!outroEntrou, b: 'Como fazer', fn: () => go('ajustes') } : null,

function bindHero(hero, saldo, animate) {
  if (!hero) return;
  if (animate) {
    hero.classList.add('intro');
    const el = $('#hero_v', hero);
    const t0 = performance.now();
    const dur = 900;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      if (el.isConnected) el.textContent = money(saldo * e);
      if (k < 1 && el.isConnected) requestAnimationFrame(step);
      else if (el.isConnected) el.textContent = money(saldo);
    };
    requestAnimationFrame(step);
  }
  if (reduceMotion()) return;
  let raf = 0;
  hero.addEventListener('pointermove', (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const r = hero.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      hero.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      hero.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      hero.style.setProperty('--px', ((x - 0.5) * 2).toFixed(3));
      hero.style.setProperty('--py', ((y - 0.5) * 2).toFixed(3));
    });
  });
  hero.addEventListener('pointerleave', () => {
    hero.style.setProperty('--px', '0');
    hero.style.setProperty('--py', '0');
  });
}

const isTouch = () => !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);

/* arrastar cartões com o dedo: toque longo ativa, soltar sobre a coluna muda a etapa */
const TouchDrag = {
  body: null,
  bind(body) {
    if (TouchDrag.body === body) return;
    TouchDrag.body = body;
    let timer = null;
    let start = null;
    let card = null;
    let ghost = null;
    let active = false;
    let over = null;
    let pt = null;
    let raf = 0;
    let offX = 0;
    let offY = 0;
    const kb = () => $('#kanban', body);
    const cancel = () => { clearTimeout(timer); timer = null; };
    const place = () => {
      if (!ghost) return;
      ghost.style.transform = `translate(${pt.x - offX}px, ${pt.y - offY}px) rotate(-2deg) scale(1.03)`;
      const el = document.elementFromPoint(pt.x, pt.y);
      const col = el && el.closest ? el.closest('.kcol') : null;
      if (col !== over) {
        if (over) over.classList.remove('over');
        over = col;
        if (over) over.classList.add('over');
      }
    };
    const loop = () => {
      if (!active) return;
      const k = kb();
      if (k) {
        const r = k.getBoundingClientRect();
        if (pt.x < r.left + 44) k.scrollLeft -= 9;
        else if (pt.x > r.right - 44) k.scrollLeft += 9;
      }
      // rolagem vertical só quando o dedo vai de propósito até a borda (acima da barra de abas ou abaixo do topo)
      const main = $('#main');
      const tb = $('#tabbar');
      const tbVis = tb && getComputedStyle(tb).display !== 'none';
      const fundo = tbVis ? tb.getBoundingClientRect().top : main.getBoundingClientRect().bottom;
      const topo = $('.topbar').getBoundingClientRect().bottom;
      if (pt.y > fundo - 28 && pt.y > start.y + 24) main.scrollTop += 8;
      else if (pt.y < topo + 28 && pt.y < start.y - 24) main.scrollTop -= 8;
      place();
      raf = requestAnimationFrame(loop);
    };
    const activate = () => {
      timer = null;
      if (!card || !card.isConnected) return;
      active = true;
      Funil.dragging = true;
      const r = card.getBoundingClientRect();
      offX = start.x - r.left;
      offY = start.y - r.top;
      ghost = card.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = r.width + 'px';
      ghost.setAttribute('aria-hidden', 'true');
      document.body.appendChild(ghost);
      card.classList.add('dragging');
      const k = kb();
      if (k) k.classList.add('is-dragging');
      try { if (navigator.vibrate) navigator.vibrate(12); } catch {}
      pt = { x: start.x, y: start.y };
      loop();
    };
    const finish = (soltar) => {
      cancelAnimationFrame(raf);
      const id = card && card.dataset.id;
      const stage = over && over.dataset.stage;
      if (over) over.classList.remove('over');
      if (ghost) ghost.remove();
      if (card) card.classList.remove('dragging');
      const k = kb();
      if (k) k.classList.remove('is-dragging');
      ghost = null;
      over = null;
      active = false;
      card = null;
      Funil.dragging = false;
      if (soltar && id && stage) moveLead(id, stage);
      if (Funil.pending) { Funil.pending = false; setTimeout(() => Funil.render(), 0); }
    };
    body.addEventListener('touchstart', (e) => {
      const c = e.target.closest('.lcard');
      if (!c || S.readOnly || e.touches.length !== 1) return;
      card = c;
      const t = e.touches[0];
      start = { x: t.clientX, y: t.clientY };
      cancel();
      timer = setTimeout(activate, 380);
    }, { passive: true });
    body.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!active) {
        if (timer && (Math.abs(t.clientX - start.x) > 8 || Math.abs(t.clientY - start.y) > 8)) { cancel(); card = null; }
        return;
      }
      e.preventDefault();
      pt = { x: t.clientX, y: t.clientY };
    }, { passive: false });
    body.addEventListener('touchend', (e) => {
      if (timer) { cancel(); card = null; return; }
      if (active) { e.preventDefault(); finish(true); }
    }, { passive: false });
    body.addEventListener('touchcancel', () => { cancel(); if (active) finish(false); card = null; });
    body.addEventListener('contextmenu', (e) => { if (e.target.closest('.lcard') && (active || timer)) e.preventDefault(); });
  },
};

function menuLead(anchor, id) {
  const l = Store.get('leads', id);
  if (!l) return;
  const aberto = ABERTAS.includes(l.etapa);
  const itens = [{ label: 'Abrir e registrar contato', ic: 'note', fn: () => showLead(id) }];
  if (aberto) {
    itens.push({ label: 'Falar amanhã', ic: 'clock', fn: async () => { try { await Store.patch('leads', id, { proximoContato: addDays(today(), 1), atualizadoEm: nowISO() }); toast(`Próximo contato com ${l.empresa}: amanhã.`); } catch {} } });
    itens.push({ sep: true });
    ABERTAS.filter((k) => k !== l.etapa).forEach((k) => itens.push({ label: `Mover para ${ETAPA[k].l}`, ic: 'arrow', fn: () => moveLead(id, k) }));
    itens.push({ sep: true });
    itens.push({ label: 'Marcar como ganho', ic: 'trophy', fn: () => winFlow({ leadId: id }) });
    itens.push({ label: 'Marcar como perdido', ic: 'xcircle', danger: true, fn: () => loseFlow(id) });
  } else {
    itens.push({ sep: true });
    ABERTAS.forEach((k) => itens.push({ label: `Reabrir em ${ETAPA[k].l}`, ic: 'repeat', fn: () => moveLead(id, k) }));
  }
  Pop.open(anchor, itens);
}
function sortLeads(a, b) {
  const fa = a.proximoContato || '9999';
  const fb = b.proximoContato || '9999';
  if (ABERTAS.includes(a.etapa) && fa !== fb) return fa.localeCompare(fb);
  return (+b.valor || 0) - (+a.valor || 0);
}
function leadCard(l) {
